        // ==========================================
        // 2. STAV APLIKACE & STORAGE
        // ==========================================
        let readings = JSON.parse(localStorage.getItem("energyReadingsV4")) || JSON.parse(JSON.stringify(defaultReadings));
        let stromBilling = JSON.parse(localStorage.getItem("energyStromV4")) || JSON.parse(JSON.stringify(defaultStromBilling));

        let currentView = localStorage.getItem("energyViewV4") || "spotreba";
        let selectedYearFilter = localStorage.getItem("energyYearFilterV4") || "all";
        let historyStack = [];

        function pushToHistory() {
            historyStack.push(JSON.stringify({
                readings: JSON.parse(JSON.stringify(readings)),
                stromBilling: JSON.parse(JSON.stringify(stromBilling))
            }));
            if (historyStack.length > 20) historyStack.shift();
            updateUndoButton();
        }

        function undo() {
            if (historyStack.length === 0) return;
            const prev = JSON.parse(historyStack.pop());
            readings = prev.readings;
            stromBilling = prev.stromBilling;
            save(false);
            updateUndoButton();
        }

        function updateUndoButton() {
            const btn = document.getElementById("undoBtn");
            if (!btn) return;
            if (historyStack.length > 0) {
                btn.disabled = false;
                btn.className = "bg-gray-900 hover:bg-gray-855 text-orange-500 rounded-lg border border-orange-900/40 flex items-center justify-center py-2.5 transition-all duration-200 cursor-pointer";
            } else {
                btn.disabled = true;
                btn.className = "bg-gray-900 text-gray-800 rounded-lg border border-gray-955 flex items-center justify-center py-2.5 transition-all duration-200 opacity-30 cursor-not-allowed";
            }
        }

        function save(writeHistory = true) {
            if (writeHistory) pushToHistory();
            localStorage.setItem("energyReadingsV4", JSON.stringify(readings));
            localStorage.setItem("energyStromV4", JSON.stringify(stromBilling));
            localStorage.setItem("energyViewV4", currentView);
            localStorage.setItem("energyYearFilterV4", selectedYearFilter);
            render();
        }

        function setView(v) {
            currentView = v;
            localStorage.setItem("energyViewV4", currentView);
            render();
        }

        function setYearFilter(yr) {
            selectedYearFilter = String(yr);
            localStorage.setItem("energyYearFilterV4", selectedYearFilter);
            render();
        }

        // 3. FORMÁTOVÁNÍ & VÝPOČTY S RESETEM HODIN
        // ==========================================
        function fmtNum(val, dec = 2) {
            if (val === null || val === undefined || isNaN(val)) return "-";
            const num = Number(val);
            if (Number.isInteger(num) && dec === 0) return num.toLocaleString('cs-CZ');
            return num.toLocaleString('cs-CZ', { minimumFractionDigits: dec, maximumFractionDigits: dec });
        }

        function fmtDelta(val, dec = 2) {
            if (val === null || val === undefined || isNaN(val)) return "";
            const sign = val >= 0 ? "+" : "";
            return `${sign}${fmtNum(val, dec)}`;
        }

        function fmtKwh(val) {
            if (val === null || val === undefined || isNaN(val)) return "-";
            const num = Number(val);
            const dec = Number.isInteger(num) ? 0 : 2;
            return num.toLocaleString('cs-CZ', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + " kWh";
        }

        function fmtEur(val) {
            if (val === null || val === undefined || isNaN(val)) return "-";
            return Number(val).toLocaleString('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
        }

        function formatCzDate(rec) {
            if (rec.displayDate) return rec.displayDate;
            if (!rec.date) return "";
            const [y, m, d] = rec.date.split("-");
            return `${parseInt(d)}.${parseInt(m)}.${y}`;
        }

        function dayOfYearFromStr(dateStr) {
            const [y, m, d] = dateStr.split("-").map(Number);
            const ref = new Date(2025, m - 1, d);
            const start = new Date(2025, 0, 1);
            return Math.floor((ref - start) / 86400000) + 1;
        }

        function computeEnrichedReadings() {
            const sorted = [...readings].sort((a, b) => a.date.localeCompare(b.date) || (a.id - b.id));

            let cumReset = {
                nakup: 0,
                prodej: 0,
                dirk: 0,
                plyn: 0,
                marTop: 0,
                dirTop: 0
            };

            const yearStartCum = {
                2024: {
                    dirk: 116,
                    marNakup: 0,
                    plyn: 23081.053,
                    marTop: 66634,
                    dirTop: 30404
                },
                2026: {
                    dirk: 4593.66,
                    marNakup: 2383.34 + 1643.53,
                    plyn: 3193.271 + 23148.714,
                    marTop: 76440,
                    dirTop: 37221
                }
            };

            let prevNormal = null;
            let prevMarTopRow = null;
            let prevDirTopRow = null;
            let prevProdejRow = null;
            let prevPlynRow = null;
            let heatZeroResetAfterPrevMar = false;
            let heatZeroResetAfterPrevDir = false;
            const enrichedList = [];

            for (let i = 0; i < sorted.length; i++) {
                const rec = sorted[i];
                const yr = rec.year || parseInt(rec.date.split("-")[0]);

                if (rec.isMeterReset) {
                    if (rec.nakup !== null && !isNaN(rec.nakup)) cumReset.nakup += Number(rec.nakup);
                    if (rec.prodej !== null && !isNaN(rec.prodej)) cumReset.prodej += Number(rec.prodej);
                    if (rec.dirk !== null && !isNaN(rec.dirk)) cumReset.dirk += Number(rec.dirk);
                    if (rec.plyn !== null && !isNaN(rec.plyn)) cumReset.plyn += Number(rec.plyn);
                    if (rec.marTop !== null && !isNaN(rec.marTop)) cumReset.marTop += Number(rec.marTop);
                    if (rec.dirTop !== null && !isNaN(rec.dirTop)) cumReset.dirTop += Number(rec.dirTop);

                    if (rec.marTop === 0) {
                        if (yearStartCum[yr]) yearStartCum[yr].marTop = cumReset.marTop;
                        heatZeroResetAfterPrevMar = true;
                    }
                    if (rec.dirTop === 0) {
                        if (yearStartCum[yr]) yearStartCum[yr].dirTop = cumReset.dirTop;
                        heatZeroResetAfterPrevDir = true;
                    }

                    enrichedList.push({
                        ...rec,
                        cumResetSnapshot: { ...cumReset },
                        cumNakup: null,
                        cumProdej: null,
                        cumDirk: null,
                        cumPlyn: null,
                        cumMarTop: null,
                        cumDirTop: null,
                        dirkYear: null,
                        marNakupYear: null,
                        plynYear: null,
                        marTopYear: null,
                        dirTopYear: null,
                        deltaNakup: null,
                        deltaProdej: null,
                        deltaDirk: null,
                        deltaMar: null,
                        deltaDirkYear: null,
                        deltaPlyn: null,
                        deltaMarTop: null,
                        deltaDirTop: null
                    });
                    continue;
                }

                const cumNakup = rec.nakup !== null ? +(Number(rec.nakup) + cumReset.nakup).toFixed(2) : null;
                const cumProdej = rec.prodej !== null ? +(Number(rec.prodej) + cumReset.prodej).toFixed(2) : null;
                const cumDirk = rec.dirk !== null ? +(Number(rec.dirk) + cumReset.dirk).toFixed(2) : null;
                const cumPlyn = rec.plyn !== null ? +(Number(rec.plyn) + cumReset.plyn).toFixed(3) : null;
                const cumMarTop = rec.marTop !== null ? +(Number(rec.marTop) + cumReset.marTop).toFixed(0) : null;
                const cumDirTop = rec.dirTop !== null ? +(Number(rec.dirTop) + cumReset.dirTop).toFixed(0) : null;

                if (!yearStartCum[yr]) {
                    const prevYrNormals = enrichedList.filter(r => !r.isMeterReset && r.year === yr - 1);
                    const lastPrev = prevYrNormals[prevYrNormals.length - 1];
                    const lastPrevMarT = [...prevYrNormals].reverse().find(r => r.cumMarTop !== null);
                    const lastPrevDirT = [...prevYrNormals].reverse().find(r => r.cumDirTop !== null);

                    yearStartCum[yr] = {
                        dirk: lastPrev && lastPrev.cumDirk !== null ? lastPrev.cumDirk : 0,
                        marNakup: lastPrev && lastPrev.cumNakup !== null && lastPrev.cumDirk !== null
                            ? +(lastPrev.cumNakup - lastPrev.cumDirk).toFixed(2)
                            : 0,
                        plyn: lastPrev && lastPrev.cumPlyn !== null ? lastPrev.cumPlyn : 0,
                        marTop: lastPrevMarT ? lastPrevMarT.cumMarTop : 0,
                        dirTop: lastPrevDirT ? lastPrevDirT.cumDirTop : 0
                    };
                }

                const base = yearStartCum[yr];

                const dirkYear = cumDirk !== null ? +(cumDirk - base.dirk).toFixed(2) : null;
                const marNakupYear = (cumNakup !== null && cumDirk !== null)
                    ? +((cumNakup - cumDirk) - base.marNakup).toFixed(2)
                    : null;
                const plynYear = cumPlyn !== null ? +(cumPlyn - base.plyn).toFixed(3) : null;
                const marTopYear = cumMarTop !== null ? +(cumMarTop - base.marTop).toFixed(0) : null;
                const dirTopYear = cumDirTop !== null ? +(cumDirTop - base.dirTop).toFixed(0) : null;

                let deltaNakup = null, deltaProdej = null, deltaDirk = null, deltaMar = null, deltaDirkYear = null, deltaPlyn = null, deltaMarTop = null, deltaDirTop = null;

                if (prevNormal) {
                    if (cumNakup !== null && prevNormal.cumNakup !== null) {
                        deltaNakup = +(cumNakup - prevNormal.cumNakup).toFixed(2);
                    }
                    if (cumDirk !== null && prevNormal.cumDirk !== null) {
                        deltaDirk = +(cumDirk - prevNormal.cumDirk).toFixed(2);
                        deltaDirkYear = deltaDirk;
                    }
                    if (deltaNakup !== null && deltaDirk !== null) {
                        deltaMar = +(deltaNakup - deltaDirk).toFixed(2);
                    }
                }
                if (cumProdej !== null && prevProdejRow) {
                    deltaProdej = +(cumProdej - prevProdejRow.cumProdej).toFixed(2);
                }
                if (cumPlyn !== null && prevPlynRow) {
                    deltaPlyn = +(cumPlyn - prevPlynRow.cumPlyn).toFixed(3);
                }
                if (cumMarTop !== null) {
                    if (heatZeroResetAfterPrevMar) {
                        deltaMarTop = Number(rec.marTop);
                        heatZeroResetAfterPrevMar = false;
                    } else if (prevMarTopRow) {
                        deltaMarTop = +(cumMarTop - prevMarTopRow.cumMarTop).toFixed(0);
                    }
                }
                if (cumDirTop !== null) {
                    if (heatZeroResetAfterPrevDir) {
                        deltaDirTop = Number(rec.dirTop);
                        heatZeroResetAfterPrevDir = false;
                    } else if (prevDirTopRow) {
                        deltaDirTop = +(cumDirTop - prevDirTopRow.cumDirTop).toFixed(0);
                    }
                }

                const enriched = {
                    ...rec,
                    cumResetSnapshot: { ...cumReset },
                    cumNakup,
                    cumProdej,
                    cumDirk,
                    cumPlyn,
                    cumMarTop,
                    cumDirTop,
                    dirkYear,
                    marNakupYear,
                    plynYear,
                    marTopYear,
                    dirTopYear,
                    deltaNakup,
                    deltaProdej,
                    deltaDirk,
                    deltaMar,
                    deltaDirkYear,
                    deltaPlyn,
                    deltaMarTop,
                    deltaDirTop
                };

                enrichedList.push(enriched);
                prevNormal = enriched;
                if (cumProdej !== null) prevProdejRow = enriched;
                if (cumPlyn !== null) prevPlynRow = enriched;
                if (cumMarTop !== null) prevMarTopRow = enriched;
                if (cumDirTop !== null) prevDirTopRow = enriched;
            }

            return enrichedList;
        }

        function getDirkResetOffsetAtEndOfYear(year) {
            const enriched = computeEnrichedReadings();
            const resetsUpToYear = enriched.filter(r => r.isMeterReset && r.year <= year && r.dirk !== null);
            return resetsUpToYear.reduce((sum, r) => sum + Number(r.dirk || 0), 0);
        }

        function getYoYComparison(targetYear, metricKey) {
            const enriched = computeEnrichedReadings();
            const currRows = enriched.filter(r => !r.isMeterReset && r.year === targetYear && r[metricKey] !== null);
            if (currRows.length === 0) return null;

            const latestCurr = currRows[currRows.length - 1];
            const currVal = latestCurr[metricKey];
            const targetDoy = dayOfYearFromStr(latestCurr.date);

            const prevYear = targetYear - 1;
            const prevRows = enriched.filter(r => !r.isMeterReset && r.year === prevYear && r[metricKey] !== null);
            if (prevRows.length === 0) return null;

            const points = [{ doy: 0, val: 0 }];
            prevRows.forEach(r => {
                points.push({ doy: dayOfYearFromStr(r.date), val: r[metricKey] });
            });
            points.sort((a, b) => a.doy - b.doy);

            let prevFullYearVal = points[points.length - 1].val;
            if (metricKey === "dirkYear" && prevYear === 2025) {
                prevFullYearVal = 2760;
            }

            let prevAtSameDate = null;
            if (targetDoy <= points[points.length - 1].doy) {
                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    if (targetDoy >= p1.doy && targetDoy <= p2.doy) {
                        const span = p2.doy - p1.doy;
                        const ratio = span > 0 ? (targetDoy - p1.doy) / span : 0;
                        prevAtSameDate = p1.val + ratio * (p2.val - p1.val);
                        break;
                    }
                }
            } else {
                const lastP = points[points.length - 1];
                const span = 365 - lastP.doy;
                const ratio = span > 0 ? Math.min(1, (targetDoy - lastP.doy) / span) : 1;
                prevAtSameDate = lastP.val + ratio * (prevFullYearVal - lastP.val);
            }

            if (prevAtSameDate === null || prevAtSameDate <= 0) return null;

            const diffVal = currVal - prevAtSameDate;
            const diffPct = (diffVal / prevAtSameDate) * 100;
            const estFullYear = prevFullYearVal * (currVal / prevAtSameDate);

            return {
                dateLabel: formatCzDate(latestCurr),
                currVal,
                prevAtSameDate,
                prevFullYearVal,
                diffVal,
                diffPct,
                estFullYear
            };
        }

        function toggleForm() {
            const form = document.getElementById("itemForm");
            form.classList.toggle("hidden");
            if (!form.classList.contains("hidden")) {
                const today = new Date().toISOString().split("T")[0];
                const nowTime = new Date().toTimeString().slice(0, 5);
                if (!document.getElementById("formDate").value) document.getElementById("formDate").value = today;
                if (!document.getElementById("formTime").value) document.getElementById("formTime").value = nowTime;
            }
        }

        function openResetModal() {
            const form = document.getElementById("itemForm");
            form.classList.remove("hidden");
            document.getElementById("formIsReset").checked = true;
            document.getElementById("formDate").value = new Date().toISOString().split("T")[0];
            document.getElementById("formDate").focus();
        }

        function saveReading() {
            const dateVal = document.getElementById("formDate").value;
            const timeVal = document.getElementById("formTime").value;
            const nakupRaw = document.getElementById("formNakup").value;
            const prodejRaw = document.getElementById("formProdej").value;
            const dirkRaw = document.getElementById("formDirk").value;
            const plynRaw = document.getElementById("formPlyn").value;
            const marTopRaw = document.getElementById("formMarTop").value;
            const dirTopRaw = document.getElementById("formDirTop").value;
            const isReset = document.getElementById("formIsReset").checked;

            if (!dateVal) {
                alert("Vyplň Datum!");
                return;
            }

            const hasAnyValue = [nakupRaw, prodejRaw, dirkRaw, plynRaw, marTopRaw, dirTopRaw].some(v => v !== "");
            if (!hasAnyValue) {
                alert("Vyplň alespoň jednu hodnotu měřiče!");
                return;
            }

            if (!isReset && (nakupRaw === "" || dirkRaw === "")) {
                alert("U běžného odečtu vyplň alespoň Nákup (kWh) a DIRK (kWh)!");
                return;
            }

            const yr = parseInt(dateVal.split("-")[0]);

            readings.push({
                id: Date.now(),
                date: dateVal,
                time: timeVal || "",
                year: yr,
                nakup: nakupRaw !== "" ? parseFloat(nakupRaw) : null,
                prodej: prodejRaw !== "" ? parseFloat(prodejRaw) : null,
                dirk: dirkRaw !== "" ? parseFloat(dirkRaw) : null,
                plyn: plynRaw !== "" ? parseFloat(plynRaw) : null,
                marTop: marTopRaw !== "" ? parseFloat(marTopRaw) : null,
                dirTop: dirTopRaw !== "" ? parseFloat(dirTopRaw) : null,
                isMeterReset: isReset
            });

            document.getElementById("formNakup").value = "";
            document.getElementById("formProdej").value = "";
            document.getElementById("formDirk").value = "";
            document.getElementById("formPlyn").value = "";
            document.getElementById("formMarTop").value = "";
            document.getElementById("formDirTop").value = "";
            document.getElementById("formIsReset").checked = false;

            toggleForm();
            save();
        }

        function deleteReading(id) {
            if (confirm("Opravdu smazat tento záznam?")) {
                readings = readings.filter(r => r.id !== id);
                save();
            }
        }

        function updateReadingField(id, field, val) {
            const rec = readings.find(r => r.id === id);
            if (!rec) return;
            if (field === "date") {
                rec.date = val;
                rec.year = parseInt(val.split("-")[0]);
                delete rec.displayDate;
            } else if (field === "time") {
                rec.time = val;
            } else {
                rec[field] = val === "" ? null : parseFloat(val);
            }
            save();
        }

        function updateStromField(year, field, val) {
            const row = stromBilling.find(s => s.year === year);
            if (!row) return;
            if (field === "endStav") {
                row.endStav = val === "" ? null : parseFloat(val);
            } else if (field === "fullPrice") {
                const full = parseFloat(val) || 0;
                row.fullPrice = full;
                row.dirkPrice = Math.round(full * 0.9 * 10) / 10;
            } else {
                row[field] = val === "" ? 0 : parseFloat(val);
            }
            save();
        }

        function confirmCurrentYearStav(year, val) {
            const row = stromBilling.find(s => s.year === year);
            if (!row) return;
            row.endStav = Number(val);
            save();
        }

        function addStromYear() {
            const maxYr = stromBilling.reduce((max, r) => Math.max(max, r.year), 2027);
            const nextYr = maxYr + 1;
            const last = stromBilling[stromBilling.length - 1];
            stromBilling.push({
                year: nextYr,
                fullPrice: last ? last.fullPrice : 33.97,
                dirkPrice: last ? last.dirkPrice : 30.57,
                grundpreis: last ? last.grundpreis : 62.40,
                messstellenbetrieb: last ? last.messstellenbetrieb : 25.00,
                endStav: null
            });
            save();
        }

        function deleteStromYear(year) {
            if (confirm(`Opravdu smazat rok ${year}?`)) {
                stromBilling = stromBilling.filter(s => s.year !== year);
                save();
            }
        }

                                            <th class="p-3 text-right text-orange-400 font-bold">Plyn v roce (m³)</th>
                                            <th class="p-3 text-right text-purple-300">Martin (kWh)</th>
                                            <th class="p-3 pr-8 text-right text-purple-300">Dirk (kWh)</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-800/70 font-mono">
                                        ${[...gasAndHeatReadings].reverse().map(r => `
                                            <tr class="hover:bg-gray-850/50 transition">
                                                <td class="p-2.5 font-sans font-bold text-gray-200">${formatCzDate(r)}</td>
                                                <td class="p-2.5 text-right text-rose-300">
                                                    <div>${fmtNum(r.plyn, 3)}</div>
                                                    ${r.deltaPlyn !== null ? `<div class="text-[10px] text-gray-500">${fmtDelta(r.deltaPlyn, 3)} m³</div>` : ''}
                                                </td>
                                                <td class="p-2.5 text-right font-bold text-orange-400">${fmtNum(r.plynYear, 3)} m³</td>
                                                <td class="p-2.5 text-right text-purple-300">
                                                    <div>${fmtNum(r.marTop, 0)}</div>
                                                    ${r.deltaMarTop !== null ? `<div class="text-[10px] text-gray-500">${fmtDelta(r.deltaMarTop, 0)}</div>` : ''}
                                                </td>
                                                <td class="p-2.5 pr-8 text-right text-purple-300">
                                                    <div>${fmtNum(r.dirTop, 0)}</div>
                                                    ${r.deltaDirTop !== null ? `<div class="text-[10px] text-gray-500">${fmtDelta(r.deltaDirTop, 0)}</div>` : ''}
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;

                mainContent.innerHTML = html;
            }
        }

        // ==========================================
        // 6. EXPORT / IMPORT
        // ==========================================
        function exportData() {
            const dataStr = JSON.stringify({ readings, stromBilling }, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', 'spotreba_energie_zaloha.json');
            linkElement.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.readings) {
                        pushToHistory();
                        readings = imported.readings;
                        stromBilling = imported.stromBilling || defaultStromBilling;
                        save(false);
                        alert("Data úspěšně nahrána!");
                    } else {
                        alert("Neplatný formát souboru zálohy.");
                    }
                } catch (err) {
                    alert("Chyba při čtení souboru JSON.");
                }
            };
            reader.readAsText(file);
        }

        render();
    </script>
</body>
</html>
