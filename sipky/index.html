<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Šipkařské Ligy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#121214] text-gray-100 min-h-screen flex flex-col">

    <!-- Horní lišta / Navigace -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <button onclick="goHome()" id="btnHomeIcon" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-orange-400 flex items-center justify-center transition cursor-pointer text-lg" title="Domů / Rozcestník">🏠</button>
            <button onclick="setView('timeline')" id="btnTimelineIcon" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-orange-400 flex items-center justify-center transition cursor-pointer text-lg" title="Aktuální zápasy">🗓️</button>
            <h1 id="pageTitle" class="text-xl font-bold text-orange-500 tracking-wide ml-2" data-lang="mainTitle">🎯 Moje Šipkařské Ligy</h1>
        </div>
        
        <!-- Sjednocená skupina tlačítek vpravo -->
        <div class="flex items-center space-x-2">
            <!-- Undo (Zpět) -->
            <button onclick="undo()" id="undoBtn" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-gray-400 flex items-center justify-center transition cursor-pointer opacity-30 cursor-not-allowed" title="Zpět">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a5 5 0 015 5v2M3 10l6 6m-6-6l6-6"/></svg>
            </button>

            <!-- Přidat (Oranžové zvýraznění) -->
            <button onclick="toggleForm()" id="btnAddIcon" class="w-10 h-10 bg-orange-600 hover:bg-orange-500 rounded-lg text-white flex items-center justify-center transition cursor-pointer shadow-lg shadow-orange-600/20" title="Přidat zápas / ligu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            </button>
            
            <!-- Import TXT (Upload -> Šipka NAHORU) -->
            <label class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-emerald-400 flex items-center justify-center transition cursor-pointer" title="Import TXT">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                <input type="file" accept=".txt" onchange="importTxt(event)" class="hidden">
            </label>

            <!-- Export TXT (Download -> Šipka DOLŮ) -->
            <button onclick="exportTxt()" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-blue-400 flex items-center justify-center transition cursor-pointer" title="Export TXT">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            </button>

            <!-- Nastavení / Servery -->
            <button onclick="openServerManager()" id="btnManageIcon" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-gray-300 flex items-center justify-center transition cursor-pointer" title="Spravovat servery">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>

            <!-- Jazyk -->
            <button onclick="toggleLanguage()" id="langSwitcher" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-xs font-bold text-gray-200 flex items-center justify-center transition cursor-pointer">🇩🇪</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-950 border-r border-gray-800 p-4 hidden md:block overflow-y-auto sidebar-scroll">
            <div id="sidebarNav" class="space-y-4"></div>
        </aside>

        <!-- Hlavní obsah -->
        <main class="flex-1 p-6 overflow-y-auto space-y-6">
            <!-- Kompletní formulář pro přidání zápasu / ligy -->
            <div id="matchForm" class="hidden bg-gray-900 p-5 rounded-xl border border-orange-500/40 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                    <h3 id="formTitle" class="text-lg font-bold text-orange-400" data-lang="formTitleAdd">Přidat zápas</h3>
                    <div class="flex gap-2 bg-gray-950 p-1 rounded border border-gray-800 text-xs">
                        <button type="button" id="mode-single" onclick="setFormMode('single')" class="px-3 py-1 rounded bg-orange-600 font-semibold text-white" data-lang="formModeSingle">Jeden zápas</button>
                        <button type="button" id="mode-bulk" onclick="setFormMode('bulk')" class="px-3 py-1 rounded text-gray-400 hover:text-white font-semibold" data-lang="formModeBulk">Hromadně (celá liga)</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Server</label>
                        <select id="formServer" onchange="checkNewServer(this.value)" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-orange-500"></select>
                        <input type="text" id="formNewServerInput" placeholder="Název nového serveru..." class="hidden w-full mt-2 bg-gray-800 border border-gray-700 p-2 rounded-lg text-sm text-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Liga / Cup</label>
                        <input type="text" id="formComp" placeholder="Liga / Cup..." class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <!-- Formát zápasu & Délka -->
                <div class="bg-gray-950/50 p-3 rounded-lg border border-gray-800 space-y-2">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider" data-lang="formMatchFormat">Formát zápasu & Délka</label>
                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                        <select id="fmtType" onchange="autoCalcDuration()" class="bg-gray-800 border border-gray-700 p-2 rounded text-sm focus:outline-none focus:border-orange-500 text-gray-200">
                            <option value="BO">Best of (BO)</option>
                            <option value="First to">First to</option>
                        </select>
                        <input type="number" id="fmtNumber" oninput="autoCalcDuration()" placeholder="Číslo (např. 8)" class="bg-gray-800 border border-gray-700 p-2 rounded text-sm focus:outline-none focus:border-orange-500 text-gray-200">
                        <input type="text" id="fmtGame" placeholder="Hra (501...)" value="501" class="bg-gray-800 border border-gray-700 p-2 rounded text-sm focus:outline-none focus:border-orange-500 text-gray-200">
                        <select id="fmtOut" class="bg-gray-800 border border-gray-700 p-2 rounded text-sm focus:outline-none focus:border-orange-500 text-gray-200">
                            <option value="DO" selected>DO</option>
                            <option value="SO">SO</option>
                            <option value="MO">MO</option>
                            <option value="DI DO">DI DO</option>
                        </select>
                        <input type="number" id="formDuration" placeholder="Délka (min)" class="bg-gray-800 border border-orange-500/50 p-2 rounded text-sm focus:outline-none focus:border-orange-500 text-orange-400 font-bold" title="Předpokládaná délka v minutách">
                    </div>
                </div>

                <!-- Limity, deadline, discord a web -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1" data-lang="formMaxWeekly">Max zápasů týdně</label>
                        <input type="number" id="formMaxWeekly" placeholder="Žádný limit" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1" data-lang="formFinalDeadline">Konečná deadline (datum)</label>
                        <input type="date" id="formFinalDeadline" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Discord (URL)</label>
                        <input type="url" id="formDiscordUrl" placeholder="https://discord.gg/..." class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Web / Tabulka (URL)</label>
                        <input type="url" id="formWebUrl" placeholder="https://..." class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <!-- Typ zápasu -->
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Typ</label>
                    <select id="formType" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-orange-500">
                        <option value="flexi" data-lang="optFlexi">Flexibilní zápas (odehraju kdykoliv)</option>
                        <option value="fixed" data-lang="optFixed">Pevné kolo / Týden</option>
                    </select>
                </div>

                <!-- Režim pro jeden zápas -->
                <div id="singleOpponentContainer" class="space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Soupeř</label>
                        <input type="text" id="formOpponent" placeholder="Soupeř..." class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                    </div>
                    <div id="singleWeekContainer">
                        <label class="block text-xs text-gray-400 mb-1">Kolo / Týden</label>
                        <input type="text" id="formWeek" placeholder="Kolo / Týden..." class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                    </div>
                </div>

                <!-- Režim pro hromadné přidání celé ligy -->
                <div id="bulkContainer" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1" data-lang="formBulkDateLabel">Datum prvního týdne (pro rozpočítání):</label>
                        <input type="date" id="formBulkStartDate" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1" data-lang="formOpponentsLabel">Seznam soupeřů (každé jméno na nový řádek):</label>
                        <textarea id="formOpponentsList" rows="5" placeholder="Hráč 1&#10;Hráč 2&#10;Hráč 3" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-orange-500 font-mono"></textarea>
                    </div>
                    <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer select-none bg-gray-950/50 p-2.5 rounded-lg border border-gray-800 w-max">
                        <input type="checkbox" id="formRematches" class="accent-orange-600 h-4 w-4">
                        <span data-lang="formRematchesLabel">Včetně odvet (zduplikovat celý seznam jako druhé kolo)</span>
                    </label>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
                    <button type="button" onclick="toggleForm()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm text-gray-300 font-semibold" data-lang="btnCancel">Zrušit</button>
                    <button type="button" onclick="saveFromForm()" class="px-4 py-2 bg-orange-600 hover:bg-orange-500 rounded-lg text-sm text-white font-bold" data-lang="btnSave">Uložit</button>
                </div>
            </div>

            <div id="filterContainer" class="hidden"></div>
            <div id="mainContentContainer" class="space-y-6"></div>
        </main>
    </div>

    <!-- Modální okno pro smazání lig -->
    <div id="leagueDeleteModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-red-400" data-lang="modalClearLeagues">Smazat server / ligy</h3>
            <p class="text-sm text-gray-300" id="leagueDeleteServerDesc"></p>
            <div class="space-y-2 max-h-60 overflow-y-auto" id="leagueDeleteList"></div>
            <div class="flex justify-between items-center pt-2">
                <button onclick="selectAllLeaguesForDelete(true)" class="text-xs text-orange-400 hover:underline" data-lang="btnSelectAll">Vybrat vše</button>
                <div class="flex gap-2">
                    <button onclick="closeLeagueDeleteModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded-lg text-sm font-semibold" data-lang="btnCancel">Zrušit</button>
                    <button onclick="confirmLeagueDeletes()" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-bold" data-lang="btnDeleteSelected">Smazat</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modální okno pro správu serverů -->
    <div id="serverManagerModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-orange-500" data-lang="modalManageServers">Spravovat servery a pořadí</h3>
            <p class="text-xs text-gray-400" data-lang="modalManageServersDesc">Použij šipky pro změnu pořadí serverů. Můžeš je také skrýt nebo trvale smazat.</p>
            <div class="space-y-2 max-h-80 overflow-y-auto" id="serverManagerList"></div>
            <div class="flex justify-end pt-2 border-t border-gray-800">
                <button onclick="closeServerManager()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-sm font-semibold" data-lang="btnSaveClose">Uložit a zavřít</button>
            </div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="storage.js"></script>
    <script src="ui.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setLanguage(currentLang);
            updateUndoButton();
            render();
        });
    </script>
</body>
</html>
