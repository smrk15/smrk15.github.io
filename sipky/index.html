<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Šipky - Kompletní Správa</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121214 }
        .sidebar-scroll::-webkit-scrollbar { width: 4px }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px }
        
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(53%) sepia(87%) saturate(1904%) hue-rotate(360deg) brightness(102%) contrast(106%);
            cursor: pointer;
        }
        input[type="date"]::-webkit-datetime-edit-fields-wrapper {
            opacity: var(--date-opacity, 1);
        }
        input[type="date"].empty-date::-webkit-datetime-edit {
            color: transparent !important;
        }
        input[type="date"].empty-date { position: relative; }
        input[type="date"].empty-date::before {
            content: attr(data-placeholder);
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #a1a1aa;
            font-size: 0.875rem;
            pointer-events: none;
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col shrink-0 text-gray-300">
            <div class="p-4 border-b border-gray-800 flex items-center justify-between gap-2">
                <button onclick="goHome()" id="btnHomeIcon" class="flex-1 bg-gray-900 hover:bg-gray-850 text-orange-500/60 hover:text-orange-450 rounded-lg border border-gray-800 flex items-center justify-center py-2.5 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                </button>
                <button onclick="setView('timeline')" id="btnTimelineIcon" class="flex-1 bg-gray-900 hover:bg-gray-850 text-orange-500/60 hover:text-orange-450 rounded-lg border border-gray-800 flex items-center justify-center py-2.5 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </button>
                <button onclick="toggleForm()" id="btnAddIcon" class="flex-1 bg-gray-900 hover:bg-gray-855 text-orange-500 hover:text-orange-400 rounded-lg border border-gray-800 flex items-center justify-center py-2.5 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                </button>
                <button onclick="undo()" id="undoBtn" disabled class="flex-1 bg-gray-900 text-gray-800 rounded-lg border border-gray-955 flex items-center justify-center py-2.5 transition-all opacity-30 cursor-not-allowed">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-4 sidebar-scroll" id="sidebarNav"></div>

            <div class="p-4 border-t border-gray-800 bg-gray-950 flex items-center justify-between gap-2">
                <button onclick="exportTxt()" id="btnExportIcon" title="Uložit do TXT (OneDrive)" class="flex-1 bg-gray-900 hover:bg-gray-850 text-orange-500/60 hover:text-orange-400 border border-gray-800 hover:border-orange-950/50 rounded-lg py-2.5 flex items-center justify-center transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V8l-4-4H8z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M12 14a3 3 0 100-6 3 3 0 000 6z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M6 20h12"></path></svg>
                </button>
                <label id="btnImportLabel" title="Nahrát TXT (OneDrive)" class="flex-1 bg-gray-900 hover:bg-gray-855 text-orange-500/60 hover:text-orange-400 border border-gray-800 hover:border-orange-950/50 rounded-lg py-2.5 flex items-center justify-center transition-all cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <input type="file" id="importTxtFile" accept=".txt" onchange="importTxt(event)" class="hidden">
                </label>
                <button onclick="openServerManager()" id="btnManageIcon" class="flex-1 bg-gray-900 hover:bg-gray-855 text-orange-500/60 hover:text-orange-400 border border-gray-800 hover:border-orange-950/50 rounded-lg py-2.5 flex items-center justify-center transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </aside>

        <!-- MAIN OBSAH -->
        <main class="flex-1 overflow-y-auto bg-[#121214] p-6 md:p-8">
            <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
                <h1 class="text-3xl font-bold text-orange-500" id="pageTitle" data-lang="mainTitle">🎯 Moje Šipkařské Ligy</h1>
                <div class="flex items-center gap-4">
                    <button onclick="toggleLanguage()" id="langSwitcher" class="text-2xl hover:scale-110 active:scale-95 transition select-none focus:outline-none">🇩🇪</button>
                </div>
            </header>

            <!-- FORMULÁŘ -->
            <div id="matchForm" class="hidden bg-gray-800 p-6 rounded-xl mb-8 border border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-orange-400" id="formTitle" data-lang="formTitleAdd">Přidat zápas</h2>
                    <div class="flex gap-2 bg-gray-900 p-1 rounded border border-gray-700 text-xs">
                        <button onclick="setFormMode('single')" id="mode-single" class="px-3 py-1 rounded bg-orange-600 font-semibold text-white" data-lang="formModeSingle">Jeden zápas</button>
                        <button onclick="setFormMode('bulk')" id="mode-bulk" class="px-3 py-1 rounded text-gray-400 hover:text-white font-semibold" data-lang="formModeBulk">Hromadně (celá liga)</button>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <select id="formServer" onchange="checkNewServer(this.value)" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500"></select>
                        <input type="text" id="formNewServerInput" placeholder="Název nového serveru" class="hidden mt-2 w-full bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500">
                    </div>

                    <input type="text" id="formComp" placeholder="Liga / Cup" class="bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500">
                    
                    <div class="md:col-span-2 bg-gray-900/40 p-4 rounded-lg border border-gray-700/60 space-y-2">
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider" data-lang="formMatchFormat">Formát zápasu & Délka</label>
                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                            <select id="fmtType" onchange="autoCalcDuration()" class="bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                                <option value="BO">Best of (BO)</option>
                                <option value="First to">First to</option>
                            </select>
                            <input type="number" id="fmtNumber" oninput="autoCalcDuration()" placeholder="Číslo (např. 8)" class="bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                            <input type="text" id="fmtGame" placeholder="Hra (501, Cricket...)" value="501" class="bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                            <select id="fmtOut" class="bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                                <option value="DO" selected>DO (Double Out)</option>
                                <option value="SO">SO (Single Out)</option>
                                <option value="MO">MO (Master Out)</option>
                                <option value="DI DO">DI DO</option>
                            </select>
                            <input type="number" id="formDuration" placeholder="Délka (min)" class="bg-gray-900 border border-orange-500/60 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500 text-orange-400 font-bold" title="Předpokládaná délka zápasu v minutách">
                        </div>
                    </div>

                    <div class="md:col-span-2 bg-gray-900/40 p-4 rounded-lg border border-gray-700/60 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1" data-lang="formMaxWeekly">Max zápasů týdně</label>
                            <input type="number" id="formMaxWeekly" placeholder="Žádný limit" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1" data-lang="formFinalDeadline">Konečná deadline (datum)</label>
                            <input type="date" id="formFinalDeadline" data-placeholder="dd.mm.rrrr" oninput="handleDatePlaceholder(this)" class="empty-date w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500 text-gray-200">
                        </div>
                    </div>

                    <div class="md:col-span-2 bg-gray-900/40 p-4 rounded-lg border border-gray-700/60 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Discord (URL odkaz)</label>
                            <input type="url" id="formDiscordUrl" placeholder="https://discord.gg/..." class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500 text-gray-200">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Web / Tabulka / Pravidla (URL odkaz)</label>
                            <input type="url" id="formWebUrl" placeholder="https://..." class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500 text-gray-200">
                        </div>
                    </div>
                    
                    <select id="formType" class="bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500">
                        <option value="flexi" data-lang="optFlexi">Flexibilní zápas (odehraju kdykoliv)</option>
                        <option value="fixed" data-lang="optFixed">Pevné kolo / Týden</option>
                    </select>
                    
                    <div id="singleWeekContainer">
                        <input type="text" id="formWeek" placeholder="Kolo / Týden" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500">
                    </div>

                    <div id="singleOpponentContainer" class="w-full">
                        <input type="text" id="formOpponent" placeholder="Soupeř" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500">
                    </div>
                    
                    <div id="bulkContainer" class="hidden md:col-span-2 space-y-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-1" data-lang="formBulkDateLabel">Datum prvního týdne (pro automatické rozpočítání po týdnech):</label>
                            <input type="date" id="formBulkStartDate" data-placeholder="dd.mm.rrrr" oninput="handleDatePlaceholder(this)" class="empty-date bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500 text-gray-200">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1" data-lang="formOpponentsLabel">Seznam soupeřů (každé jméno na nový řádek):</label>
                            <textarea id="formOpponentsList" rows="5" placeholder="Pavel&#10;Honza&#10;Jan" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500 font-mono text-sm"></textarea>
                        </div>
                        <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer select-none bg-gray-900/50 p-3 rounded-lg border border-gray-700/60 w-max">
                            <input type="checkbox" id="formRematches" class="accent-orange-500 h-4 w-4">
                            <span data-lang="formRematchesLabel">Včetně odvet (zduplikovat celý seznam jako druhé kolo)</span>
                        </label>
                    </div>
                </div>
                
                <div class="flex gap-3 mt-4 justify-end">
                    <button onclick="toggleForm()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-semibold" data-lang="btnCancel">Zrušit</button>
                    <button onclick="saveFromForm()" class="bg-orange-600 hover:bg-orange-500 px-4 py-2 rounded-lg font-semibold text-white" data-lang="btnSave">Uložit</button>
                </div>
            </div>

            <!-- KONTEJNER PRO OBSAH -->
            <div id="mainContentContainer" class="space-y-6"></div>
        </main>
    </div>

    <!-- MODALY -->
    <div id="leagueDeleteModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 max-w-md w-full space-y-4">
            <h3 class="text-xl font-bold text-orange-500" data-lang="modalClearLeagues">Smazat ligy</h3>
            <p class="text-sm text-gray-400" id="leagueDeleteServerDesc"></p>
            <div class="space-y-2 max-h-60 overflow-y-auto" id="leagueDeleteList"></div>
            <div class="flex justify-between items-center pt-4 border-t border-gray-800">
                <button onclick="selectAllLeaguesForDelete(true)" class="text-xs text-orange-400 hover:underline" data-lang="btnSelectAll">Vybrat vše</button>
                <div class="flex gap-2">
                    <button onclick="closeLeagueDeleteModal()" class="bg-gray-800 hover:bg-gray-700 text-sm font-semibold px-4 py-2 rounded-lg" data-lang="btnCancel">Zrušit</button>
                    <button onclick="confirmLeagueDeletes()" class="bg-red-600 hover:bg-red-500 text-sm font-semibold px-4 py-2 rounded-lg text-white" data-lang="btnDeleteSelected">Smazat vybrané</button>
                </div>
            </div>
        </div>
    </div>

    <div id="serverManagerModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 max-w-lg w-full space-y-4">
            <h3 class="text-xl font-bold text-orange-500" data-lang="modalManageServers">Spravovat servery a pořadí</h3>
            <p class="text-sm text-gray-400" data-lang="modalManageServersDesc">Použij šipky pro změnu pořadí serverů. Můžeš je také skrýt nebo trvale smazat.</p>
            <div class="space-y-3 max-h-80 overflow-y-auto" id="serverManagerList"></div>
            <div class="flex justify-end gap-2 pt-4 border-t border-gray-800">
                <button onclick="closeServerManager()" class="bg-gray-800 hover:bg-gray-700 text-sm font-semibold px-4 py-2 rounded-lg" data-lang="btnSaveClose">Uložit a zavřít</button>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            cs: {
                homeBtn: "Domů / Rozcestník",
                timelineBtn: "Časová osa zápasů",
                undoBtn: "Zpět",
                manageServersBtn: "Spravovat servery",

                formTitleAdd: "Přidat zápas",
                formModeSingle: "Jeden zápas",

                optNewServer: "+ Nový server...",

                formMaxWeekly: "Max zápasů týdně",

                btnCancel: "Zrušit",
                btnSave: "Uložit",
                btnSelectAll: "Vybrat vše",
                btnDeleteSelected: "Smazat vybrané",
                btnSaveClose: "Uložit a zavřít",
                modalClearLeagues: "Smazat ligy",
                modalManageServers: "Spravovat servery a pořadí",
                modalManageServersDesc: "Použij šipky pro změnu pořadí serverů. Můžeš je také skrýt nebo trvale smazat.",
                serverLabelEmpty: "Tento server je prázdný. Přidej do něj ligu.",
                emptyMatchesLabel: "Žádné domluvené ani označené zápasy k dohrávce.",
                noServersLabel: "Žádné servery ani zápasy. Nahraj svá data přes TXT soubor vlevo dole nebo přidej první zápas kliknutím nahoře.",
                confrimDeleteMatch: "Opravdu smazat zápas?",
                confirmDeleteSelectedLeagues: "Opravdu chceš smazat vybrané ligy včetně všech zápasů?",
                confrimDeleteServer: "Opravdu chceš NATRVALO smazat tento server i se všemi zápasy?",
                lblDeadline: "Do:",
                lblMaxWeekly: "Limit:",
                placeholderNote: "Poznámka (např. dovolená, neodpovídá...)",
                lblConfirmedCheck: "Potvrzeno?",
                btnDelete: "Smazat",
                tooltipEditServer: "Upravit název serveru",
                tooltipDeleteLeagues: "Smazat vybrané ligy",
                tooltipEditLeague: "Upravit název ligy",
                tooltipCancelDate: "Vymazat termín",
                placeholderWeek: "Kolo / Týden",
                placeholderDateInput: "dd.mm.rrrr"
            },
            de: {
                homeBtn: "Hauptmenü / Übersicht",
                timelineBtn: "Terminübersicht",
                undoBtn: "Rückgängig",
                manageServersBtn: "Server verwalten",
                mainTitle: "🎯 Meine Darts-Ligen",
                timelineTitle: "🗓️ Terminübersicht der Spiele",
                addMatchBtn: "Spiel / Liga hinzufügen",
                formTitleAdd: "Spiel hinzufügen",
                formModeSingle: "Einzelnes Spiel",
                formModeBulk: "Massenhaft (ganze Liga)",
                optNewServer: "+ Neuer Server...",
                formMatchFormat: "Spielformat & Dauer",
                formMaxWeekly: "Max. Spiele pro Woche",
                formFinalDeadline: "Endgültige Deadline (Datum)",
                optFlexi: "Flexibles Spiel (jederzeit spielbar)",
                optFixed: "Feste Spielwoche / Runde",
                formBulkDateLabel: "Datum der ersten Woche (für automatische Wochenberechnung):",
                formOpponentsLabel: "Gegnerliste (jeder Name in eine neue Zeile):",
                formRematchesLabel: "Inklusive Rückspiele (gesamte Liste verdoppeln)",
                btnCancel: "Abbrechen",
                btnSave: "Speichern",
                btnSelectAll: "Alle auswählen",
                btnDeleteSelected: "Ausgewählte Ligen löschen",
                btnSaveClose: "Speichern & Schließen",
                modalClearLeagues: "Ligen löschen",

                modalManageServersDesc: "Verwende die Pfeile, um die Reihenfolge der Server zu ändern.",
                serverLabelEmpty: "Dieser Server ist leer. Füge eine Liga hinzu.",
                emptyMatchesLabel: "Keine vereinbarten oder zum Nachholen markierten Spiele.",
                noServersLabel: "Keine Server oder Spiele vorhanden. Lade deine Daten über die TXT-Datei unten links hoch.",

                confirmDeleteSelectedLeagues: "Möchtest du die ausgewählten Ligen inklusive aller Spiele wirklich löschen?",
                confrimDeleteServer: "Möchtest du diesen Server mitsamt allen Spielen wirklich DAUERHAFT löschen?",
                lblDeadline: "Bis:",
                lblMaxWeekly: "Limit:",
                placeholderNote: "Notiz (z.B. Urlaub, antwortet nicht...)",
                lblConfirmedCheck: "Bestätigt?",
                btnDelete: "Löschen",
                tooltipEditServer: "Servernamen bearbeiten",
                tooltipDeleteLeagues: "Ausgewählte Ligen löschen",
                tooltipEditLeague: "Liganamen bearbeiten",
                tooltipCancelDate: "Termin löschen",
                placeholderWeek: "Runde / Woche",
                placeholderDateInput: "tt.mm.jjjj"
            }
        }

        let currentLang = localStorage.getItem("dartLang") || "cs"

        function toggleLanguage() {
            setLanguage(currentLang === "cs" ? "de" : "cs")
        }

        function setLanguage(lang) {
            currentLang = lang
            localStorage.setItem("dartLang", lang)
            document.getElementById("langSwitcher").innerText = lang === "cs" ? "🇩🇪" : "🇨🇿"
            translateUI()
            render()
        }

        function handleDatePlaceholder(input) {
            if (input.value) {
                input.classList.remove("empty-date")
                input.style.setProperty("--date-opacity", "1")
            } else {
                input.classList.add("empty-date")
                input.style.setProperty("--date-opacity", "0")
            }
        }

        function setupDateInput(input) {

        /* ================= VÝPOČET DÉLKY ZÁPASU PODLE LEGŮ ================= */

        function getLegsFromFormat(formatStr) {
            if (!formatStr) return 7
            const fmtLower = formatStr.toLowerCase()
            const matchNum = fmtLower.match(/\d+/)
            if (!matchNum) return 7

            const num = parseInt(matchNum[0])
            
            if (fmtLower.includes("first to") || fmtLower.includes("race to")) {
                return (2 * num) - 1
            }
            return num
        }

        function calculateDurationMinutes(formatStr) {
            const legs = getLegsFromFormat(formatStr)
            if (legs <= 8) return 30
            if (legs <= 11) return 45
            return 60
        }

        function autoCalcDuration() {
            const formatStr = buildFormatString()
            const minutes = calculateDurationMinutes(formatStr)
            document.getElementById("formDuration").value = minutes
        }

        /* ================= GENERÁTOR GOOGLE KALENDÁŘE ================= */

        function openGoogleCalendar(id) {
            const match = matches.find(m => m.id === id)
            if (!match || !match.date) return

            const cleanDate = match.date.replace(/-/g, "")
            const duration = match.duration || calculateDurationMinutes(match.format)

            let startIso = ""
            let endIso = ""

            if (match.time) {
                const parts = match.time.split(":")
                const startHour = parseInt(parts[0])
                const startMin = parseInt(parts[1])

                const startDateObj = new Date(match.date)
                startDateObj.setHours(startHour, startMin, 0)

                const endDateObj = new Date(startDateObj.getTime() + duration * 60000)

                const pad = (n) => n.toString().padStart(2, "0")
                
                startIso = `${cleanDate}T${pad(startHour)}${pad(startMin)}00`
                endIso = `${endDateObj.getFullYear()}${pad(endDateObj.getMonth() + 1)}${pad(endDateObj.getDate())}T${pad(endDateObj.getHours())}${pad(endDateObj.getMinutes())}00`
            } else {
                startIso = cleanDate
                endIso = cleanDate
            }

            const title = encodeURIComponent(`🎯 ${match.comp} - ${match.format} - ${match.opponent}`)
            
            let detailsText = `Soupeř: ${match.opponent}\nFormát: ${match.format}\nServer: ${match.server}\nLiga: ${match.comp}\nDélka: ${duration} min`
            if (match.week) detailsText += `\nKolo: ${match.week}`
            if (match.notes) detailsText += `\nPoznámka: ${match.notes}`
            if (match.webUrl) detailsText += `\nWeb: ${match.webUrl}`
            if (match.discordUrl) detailsText += `\nDiscord: ${match.discordUrl}`

            const details = encodeURIComponent(detailsText)
            const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startIso}/${endIso}&details=${details}`

            window.open(gcalUrl, '_blank')
        }

        /* ================= PARSER A EXPORT PRO TXT SOUBOR ================= */

        function importTxt(event) {
            const file = event.target.files[0]
            if (!file) return

            const reader = new FileReader()
            reader.onload = function(e) {
                const text = e.target.result
                parseTxtData(text)
            }
            reader.readAsText(file)
        }

        function parseTxtData(textText) {
            pushToHistory()
            const newMatches = []
            const blocks = textText.split(/----+/).map(b => b.trim()).filter(b => b.length > 0)

            blocks.forEach((block, bIdx) => {
                const lines = block.split("\n").map(l => l.trim()).filter(l => l.length > 0)
                if (lines.length === 0) return

                const headerLine = lines[0]
                const headerParts = headerLine.split("->").map(p => p.trim())
                
                let server = ""
                let compFull = ""
                let format = "BO 8 501 DO"
                let weekInfo = ""
                let webUrl = ""
                let discordUrl = ""

                headerParts.forEach(part => {
                    if (part.startsWith("http")) {
                        if (part.includes("discord")) discordUrl = part
                        else webUrl = part
                    }
                })

                const nonUrlParts = headerParts.filter(p => !p.startsWith("http"))

                if (nonUrlParts.length >= 3) {
                    server = nonUrlParts[0]
                    compFull = nonUrlParts[1]
                    format = nonUrlParts[2] || format
                    if (nonUrlParts[3]) weekInfo = nonUrlParts[3]
                } else {
                    compFull = nonUrlParts[0] || "Liga"
                    format = nonUrlParts[1] || format
                    if (nonUrlParts[2]) weekInfo = nonUrlParts[2]

                    const combinedCheck = `${compFull} ${webUrl} ${discordUrl}`.toLowerCase()
                    if (combinedCheck.includes("elitedartclub") || combinedCheck.includes("edc")) server = "EDC"
                    else if (combinedCheck.includes("scolia-checkout-community") || combinedCheck.includes("scolia")) server = "Scolia Checkout Community"
                    else if (combinedCheck.includes("dartfan")) server = "Dartfan online"
                    else if (combinedCheck.includes("hood")) server = "HOOD"
                    else if (combinedCheck.includes("dbf")) server = "DBF"
                    else server = "Ostatní"
                }

                const duration = calculateDurationMinutes(format)

                lines.slice(1).forEach((mLine, mIdx) => {
                    if (!mLine.startsWith("-")) return
                    const cleanLine = mLine.replace(/^-/, "").trim()
                    const matchParts = cleanLine.split("->").map(p => p.trim())
                    
                    const opponent = matchParts[0]
                    
                    let date = ""
                    let time = ""
                    let confirmed = false
                    let mustPlay = false
                    let week = weekInfo
                    let notes = ""

                    matchParts.slice(1).forEach(part => {
                        if (part.includes("🔥 DOHRAVKA")) {
                            mustPlay = true
                        } else if (part.startsWith("W:")) {
                            week = part.replace("W:", "").trim()
                        } else if (part.startsWith("NOTE:")) {
                            notes = part.replace("NOTE:", "").trim()
                        } else {
                            const dtMatch = part.match(/(\d{1,2})\.(\d{1,2})\.?(?:\s+(\d{1,2}:\d{2}))?/)
                            if (dtMatch) {
                                const day = dtMatch[1].padStart(2, '0')
                                const month = dtMatch[2].padStart(2, '0')
                                const currentYear = new Date().getFullYear()
                                date = `${currentYear}-${month}-${day}`
                                if (dtMatch[3]) time = dtMatch[3]
                                confirmed = true
                            }
                        }
                    })

                    newMatches.push({
                        id: Date.now() + (bIdx * 100) + mIdx,
                        server,
                        comp: compFull,
                        opponent,
                        format,
                        duration,
                        type: week ? "fixed" : "flexi",
                        week,
                        date,
                        time,
                        confirmed,
                        mustPlay,
                        status: date ? "scheduled" : "unscheduled",
                        notes,
                        maxWeekly: "",
                        finalDeadline: "",
                        discordUrl,
                        webUrl
                    })
                })
            })

            if (newMatches.length > 0) {
                matches = newMatches
                save()
                alert(currentLang === "cs" ? "TXT soubor byl úspěšně načten!" : "TXT-Datei erfolgreich geladen!")
            } else {
                alert(currentLang === "cs" ? "V souboru nebyla nalezena žádná platná data." : "Keine gültigen Daten gefunden.")
            }
        }

        function exportTxt() {
            const grouped = {}
            matches.forEach(m => {
                const key = `${m.server}::${m.comp}`
                if (!grouped[key]) grouped[key] = []
                grouped[key].push(m)
            })

            let txtContent = ""

            Object.keys(grouped).forEach((key, idx) => {
                const compMatches = grouped[key]
                const first = compMatches[0]

                let header = `${first.server} -> ${first.comp}`
                if (first.format) header += ` -> ${first.format}`
                if (first.week) header += ` -> ${first.week}`
                if (first.webUrl) header += ` -> ${first.webUrl}`
                if (first.discordUrl) header += ` -> ${first.discordUrl}`

                txtContent += `${header}\n`

                compMatches.forEach(m => {
                    let line = `- ${m.opponent}`
                    if (m.date) {
                        const parts = m.date.split("-")
                        const formattedDate = `${parts[2]}.${parts[1]}.`
                        line += ` -> ${formattedDate}`
                        if (m.time) line += ` ${m.time}`
                    } else {
                        line += ` -> `
                    }

                    if (m.mustPlay) line += ` -> 🔥 DOHRAVKA`
                    if (m.week) line += ` -> W: ${m.week}`
                    if (m.notes) line += ` -> NOTE: ${m.notes}`

                    txtContent += `${line}\n`
                })

                if (idx < Object.keys(grouped).length - 1) {
                    txtContent += `\n---------------------------------------------------------------------------\n\n`
                }
            })

            const blob = new Blob([txtContent], { type: "text/plain;charset=utf-8" })
            const linkElement = document.createElement("a")
            linkElement.href = URL.createObjectURL(blob)
            linkElement.download = "Šipky zápasy.txt"
            linkElement.click()
        }

        /* ================= OSTATNÍ LOGIKA ================= */

        function pushToHistory() {
            const state = {
                matches: JSON.parse(JSON.stringify(matches)),
                emptyServers: JSON.parse(JSON.stringify(emptyServers)),
                emptyLeagues: JSON.parse(JSON.stringify(emptyLeagues)),
                hiddenServers: JSON.parse(JSON.stringify(hiddenServers)),
                serverOrder: JSON.parse(JSON.stringify(serverOrder))
            }
            historyStack.push(JSON.stringify(state))
            if (historyStack.length > 20) historyStack.shift()
            updateUndoButton()
        }

        function undo() {
            if (historyStack.length === 0) return
            const previousState = JSON.parse(historyStack.pop())
            matches = previousState.matches
            emptyServers = previousState.emptyServers
            emptyLeagues = previousState.emptyLeagues || []
            hiddenServers = previousState.hiddenServers
            serverOrder = previousState.serverOrder || []
            localStorage.setItem("dartMatchesV23", JSON.stringify(matches))
            localStorage.setItem("dartEmptyServersV23", JSON.stringify(emptyServers))
            localStorage.setItem("dartEmptyLeaguesV23", JSON.stringify(emptyLeagues))
            localStorage.setItem("dartHiddenServersV23", JSON.stringify(hiddenServers))
            localStorage.setItem("dartServerOrderV23", JSON.stringify(serverOrder))
            updateUndoButton()
            render()
        }

        }

        function editServerName(oldName) {
            const newName = prompt(currentLang === "cs" ? `Zadej nový název pro server "${oldName}":` : `Neuer Name für Server "${oldName}":`, oldName)
            if (newName && newName.trim() !== oldName) {
                pushToHistory()
                matches.forEach(m => {
                    if (m.server === oldName) m.server = newName.trim()
                })
                emptyLeagues.forEach(l => {
                    if (l.server === oldName) l.server = newName.trim()
                })
                const emptyIdx = emptyServers.indexOf(oldName)
                if (emptyIdx !== -1) emptyServers[emptyIdx] = newName.trim()
                const hidIdx = hiddenServers.indexOf(oldName)
                if (hidIdx !== -1) hiddenServers[hidIdx] = newName.trim()
                const orderIdx = serverOrder.indexOf(oldName)
                if (orderIdx !== -1) serverOrder[orderIdx] = newName.trim()
                updateServerSelect()
                save()
            }

                pushToHistory()
                matches.forEach(m => {
                    if (m.server === serverName && m.comp === oldCompName) m.comp = newName.trim()
                })
                emptyLeagues.forEach(l => {
                    if (l.server === serverName && l.comp === oldCompName) l.comp = newName.trim()
                })
                save()
            }
        }

        function moveServerOrder(serverName, direction) {
            pushToHistory()
            const allServers = getAllServersOrdered()
            const index = allServers.indexOf(serverName)
            if (index === -1) return

            const newIndex = index + direction
            if (newIndex >= 0 && newIndex < allServers.length) {
                const temp = allServers[index]
                allServers[index] = allServers[newIndex]
                allServers[newIndex] = temp
                serverOrder = allServers
                save()
                openServerManager()
            }
        }

        function getAllServersOrdered() {
            const existing = [...new Set([...matches.map(m => m.server), ...emptyServers, ...emptyLeagues.map(l => l.server)])]
            let ordered = []

            serverOrder.forEach(s => {
                if (existing.includes(s)) ordered.push(s)
            })

            existing.forEach(s => {
                if (!ordered.includes(s)) ordered.push(s)
            })

            return ordered
        }

                pushToHistory()
                matches = matches.filter(m => m.server !== serverName)
                emptyServers = emptyServers.filter(s => s !== serverName)
                emptyLeagues = emptyLeagues.filter(l => l.server !== serverName)
                hiddenServers = hiddenServers.filter(s => s !== serverName)
                serverOrder = serverOrder.filter(s => s !== serverName)
                updateServerSelect()
                save()
                openServerManager()
            }
        }

        function updateServerSelect() {
            const select = document.getElementById("formServer")
            const currentVal = select.value
            const activeServers = getAllServersOrdered()
            
            select.innerHTML = ""
            
            if (activeServers.length === 0) {
                select.appendChild(new Option(translations[currentLang].optNewServer, "__NEW__"))
                select.value = "__NEW__"
                checkNewServer("__NEW__")
            } else {
                activeServers.forEach(s => select.appendChild(new Option(s, s)))
                select.appendChild(new Option(translations[currentLang].optNewServer, "__NEW__"))
                
                if (activeServers.includes(currentVal) || currentVal === "__NEW__") {
                    select.value = currentVal
                } else {
                    select.value = activeServers[0]
                }
                checkNewServer(select.value)
            }
        }

        function buildFormatString() {
            const type = document.getElementById("fmtType").value
            const num = document.getElementById("fmtNumber").value.trim()
            const game = document.getElementById("fmtGame").value.trim() || "501"
            const outType = document.getElementById("fmtOut").value

            let formatNum = num ? `${num} ` : ''
            let formatOut = outType ? ` ${outType}` : ''
            return `${type} ${formatNum}${game}${formatOut}`.replace(/\s+/g, ' ').trim()
        }

        function isCurrentCalendarWeek(dateString) {
            if (!dateString) return false
            const date = new Date(dateString)
            const now = new Date()
            
            const startOfWeek = (d) => {
                const day = d.getDay()
                const diff = d.getDate() - day + (day === 0 ? -6 : 1)
                const start = new Date(d.setDate(diff))
                start.setHours(0,0,0,0)
                return start
            }

            const currentMonday = startOfWeek(now)
            const matchMonday = startOfWeek(date)
            return currentMonday.getTime() === matchMonday.getTime()
        }

        function isWeekInPastOrCurrent(weekStr) {
            if (!weekStr) return false
            const match = weekStr.match(/(\d{1,2})\.(\d{1,2})\./)
            if (!match) return false

            const day = parseInt(match[1])
            const month = parseInt(match[2]) - 1
            const now = new Date()
            let year = now.getFullYear()

            if (month < now.getMonth() - 2) {
                year += 1
            }

            const weekStart = new Date(year, month, day)
            weekStart.setHours(0, 0, 0, 0)

            return now >= weekStart
        }

        function formatDateToLabel(date) {
            return `${date.getDate()}.${date.getMonth() + 1}.`
        }

        function saveFromForm() {
            let server = document.getElementById("formServer").value
            if (server === "__NEW__") {
                const newServerInput = document.getElementById("formNewServerInput").value.trim()
                if (!newServerInput) {
                    alert(currentLang === "cs" ? "Zadej název nového serveru" : "Servernamen eingeben")
                    return
                }
                server = newServerInput
            }

            const comp = document.getElementById("formComp").value.trim()
            const format = buildFormatString()
            const type = document.getElementById("formType").value
            const maxWeekly = document.getElementById("formMaxWeekly").value.trim()
            
            const customDuration = parseInt(document.getElementById("formDuration").value) || calculateDurationMinutes(format)

            const ffd = document.getElementById("formFinalDeadline")
            const finalDeadline = ffd.value || ""
            const fbs = document.getElementById("formBulkStartDate")
            const startDateVal = fbs.value || ""
            
            const discordUrl = document.getElementById("formDiscordUrl").value.trim()
            const webUrl = document.getElementById("formWebUrl").value.trim()

            if (!comp) {
                alert(currentLang === "cs" ? "Vyplň název ligy / cupu" : "Liganamen eingeben")
                return
            }

            pushToHistory()
            emptyServers = emptyServers.filter(s => s !== server)
            emptyLeagues = emptyLeagues.filter(l => !(l.server === server && l.comp === comp))

            if (formMode === "single") {
                const opponent = document.getElementById("formOpponent").value.trim()
                const week = document.getElementById("formWeek").value.trim()
                if (!opponent) {
                    alert(currentLang === "cs" ? "Vyplň soupeře" : "Gegner eingeben")
                    return
                }
                
                matches.push({
                    id: Date.now(),
                    server, comp, opponent, format, duration: customDuration, type, week,
                    date: "", time: "", confirmed: false, mustPlay: false, status: "unscheduled", notes: "", maxWeekly, finalDeadline, discordUrl, webUrl
                })
            } else {
                const listText = document.getElementById("formOpponentsList").value
                const names = listText.split("\n").map(n => n.trim()).filter(n => n.length > 0)
                
                if (names.length === 0) {
                    alert(currentLang === "cs" ? "Zadej aspoň jednoho soupeře" : "Mindestens einen Gegner eingeben")
                    return
                }

                const includeRematches = document.getElementById("formRematches").checked
                let baseDate = startDateVal ? new Date(startDateVal) : null

                names.forEach((name, index) => {
                    let calculatedWeek = ""
                    if (baseDate) {
                        let currentWeekDate = new Date(baseDate)
                        currentWeekDate.setDate(baseDate.getDate() + (index * 7))
                        calculatedWeek = `(${formatDateToLabel(currentWeekDate)})`
                    }

                    matches.push({
                        id: Date.now() + index,
                        server, comp, opponent: name, format, duration: customDuration, type, week: calculatedWeek,
                        date: "", time: "", confirmed: false, mustPlay: false, status: "unscheduled", notes: "", maxWeekly, finalDeadline, discordUrl, webUrl
                    })
                })

                if (includeRematches) {
                    names.forEach((name, index) => {
                        let calculatedWeek = ""
                        if (baseDate) {
                            let currentWeekDate = new Date(baseDate)
                            currentWeekDate.setDate(baseDate.getDate() + ((names.length + index) * 7))
                            calculatedWeek = `(${formatDateToLabel(currentWeekDate)})`
                        }

                        matches.push({
                            id: Date.now() + names.length + index,
                            server, comp, opponent: name, format, duration: customDuration, type, week: calculatedWeek,
                            date: "", time: "", confirmed: false, mustPlay: false, status: "unscheduled", notes: "", maxWeekly, finalDeadline, discordUrl, webUrl
                        })
                    })
                }
            }

            updateServerSelect()
            delete closedStates[server]
            delete closedStates[`${server}-${comp}`]
            save()
            toggleForm()

            document.getElementById("formComp").value = ""
            document.getElementById("formOpponent").value = ""
            document.getElementById("formWeek").value = ""
            document.getElementById("formOpponentsList").value = ""
            document.getElementById("formRematches").checked = false
            document.getElementById("formNewServerInput").value = ""
            document.getElementById("formNewServerInput").classList.add("hidden")
            document.getElementById("fmtNumber").value = ""
            
            ffd.value = ""
            handleDatePlaceholder(ffd)
            fbs.value = ""
            handleDatePlaceholder(fbs)
            
            document.getElementById("formMaxWeekly").value = ""
            document.getElementById("formDiscordUrl").value = ""
            document.getElementById("formWebUrl").value = ""
        }

        function toggleConfirmed(id) {
            pushToHistory()
            const match = matches.find(m => m.id === id)
            if (match && match.date) {
                match.confirmed = !match.confirmed
                save()
            }
        }

        function deleteMatch(id) {
            if (confirm(translations[currentLang].confrimDeleteMatch)) {
                pushToHistory()
                const match = matches.find(m => m.id === id)
                const serverName = match ? match.server : null
                const compName = match ? match.comp : null
                
                matches = matches.filter(m => m.id !== id)
                
                if (serverName && compName && !matches.some(m => m.server === serverName && m.comp === compName)) {
                    if (!emptyLeagues.some(l => l.server === serverName && l.comp === compName)) {
                        emptyLeagues.push({ server: serverName, comp: compName })
                    }
                }
                save()
            }
        }

        function getFullGroupedData() {
            const grouped = {}
            const orderedServers = getAllServersOrdered()

            orderedServers.forEach(s => {
                if (hiddenServers.includes(s)) return
                grouped[s] = {}
            })

            matches.forEach(m => {
                if (hiddenServers.includes(m.server)) return
                if (!grouped[m.server]) grouped[m.server] = {}
                if (!grouped[m.server][m.comp]) grouped[m.server][m.comp] = []
                grouped[m.server][m.comp].push(m)
            })

            emptyLeagues.forEach(l => {
                if (hiddenServers.includes(l.server)) return
                if (!grouped[l.server]) grouped[l.server] = {}
                if (!grouped[l.server][l.comp]) grouped[l.server][l.comp] = []
            })

            return grouped
        }

                                    ${discordUrl ? `<a href="${discordUrl}" target="_blank" title="Discord" class="bg-indigo-600/10 hover:bg-indigo-600/30 text-indigo-400 border border-indigo-900/40 rounded p-1.5 transition flex items-center justify-center select-none">
                                        <svg class="w-4 h-4 fill-current" viewBox="0 0 127.14 96.36">
                                            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,121.71,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.92,53.87,53,48.8,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.2,45.92,96.07,53,91,65.69,84.69,65.69Z"/>
                                        </svg>
                                    </a>` : ""}
                                    ${webUrl ? `<a href="${webUrl}" target="_blank" title="Web / Tabulka / Pravidla" class="bg-orange-600/10 hover:bg-orange-600/30 text-orange-400 border border-orange-900/40 rounded p-1 text-xs transition flex items-center justify-center select-none">🌐</a>` : ""}
                                </div>
                            `
                        }

                        let limitInfoHtml = ""
                        if (maxWeekly || finalDeadline) {
                            limitInfoHtml = `
                                <div class="flex items-center gap-3 text-xs bg-gray-900 px-2.5 py-1 rounded border border-gray-800/80">
                                    ${maxWeekly ? `<span><b class="text-orange-400">${translations[currentLang].lblMaxWeekly}</b> ${maxWeekly}</span>` : ""}
                                    ${finalDeadline ? `<span><b class="text-orange-400">${translations[currentLang].lblDeadline}</b> ${formattedDeadline}</span>` : ""}
                                </div>
                            `
                        }

                        const leagueEl = document.createElement("div")
                        leagueEl.id = leagueHtmlId
                        leagueEl.className = "bg-gray-800/40 rounded-lg border border-gray-855 shadow-inner"

                        leagueEl.innerHTML = `
                            <div class="p-3 bg-gray-800/80 flex justify-between items-center rounded-t-lg select-none">
                                <div class="flex items-center gap-2">
                                    <span onclick="toggleCollapse('${leagueStateKey}')" class="cursor-pointer text-xs font-bold text-gray-400 bg-gray-900 hover:bg-gray-755 p-1 px-1.5 rounded">
                                        ${isLeagueOpen ? '▲' : '▼'}
                                    </span>
                                    <h3 class="font-semibold text-gray-200 flex items-center gap-2">
                                        🏆 ${compName}
                                        <span class="text-xs bg-gray-900 text-gray-400 px-2 py-0.5 rounded-full">${compMatches.length}</span>
                                    </h3>
                                    <button onclick="editCompName('${serverName}', '${compName}')" class="text-gray-500 hover:text-orange-400 text-xs p-1 transition" title="${translations[currentLang].tooltipEditLeague}">✏️</button>
                                    ${linksHtml}
                                </div>
                                ${limitInfoHtml}
                            </div>
                        `

                        if (isLeagueOpen) {
                            const matchesList = document.createElement("div")
                            matchesList.className = "p-3 space-y-3 border-t border-gray-800 bg-gray-900/20"

                            if (compMatches.length === 0) {
                                matchesList.innerHTML = `
                                    <div class="p-4 text-center border border-dashed border-gray-800 rounded-lg">
                                        <p class="text-xs text-gray-500 mb-2">${currentLang === "cs" ? "Tato liga zatím nemá žádné zápasy." : "Diese Liga hat noch keine Spiele."}</p>
                                        <button onclick="toggleForm('${serverName}', '${compName}')" class="text-xs bg-orange-600/20 hover:bg-orange-600/30 text-orange-400 px-3 py-1.5 rounded-lg border border-orange-500/30 font-semibold transition">
                                            + ${currentLang === "cs" ? "Přidat zápas do této ligy" : "Spiel zu dieser Liga hinzufügen"}
                                        </button>
                                    </div>
                                `
                            }

                            compMatches.forEach(m => {
                                const isEditing = editingMatchIds.has(m.id)
                                const matchEl = document.createElement("div")

                                let nameColorClass = "text-white"
                                if (m.date) {
                                    if (isCurrentCalendarWeek(m.date)) {
                                        nameColorClass = "text-yellow-400"
                                    } else if (m.confirmed) {
                                        nameColorClass = "text-emerald-400"
                                    } else {
                                        nameColorClass = "text-red-400"
                                    }
                                }

                                const isMatchCurrentWeekNeeded = !m.date && isWeekInPastOrCurrent(m.week)

                                let formattedMatchDate = ""
                                if (m.date && m.date.includes("-")) {
                                    const parts = m.date.split("-")
                                    formattedMatchDate = `${parseInt(parts[2])}.${parseInt(parts[1])}.`
                                }

                                if (isEditing) {
                                    matchEl.className = "p-4 rounded-xl border bg-gray-800/90 border-orange-500/60 flex flex-col md:flex-row md:items-center justify-between gap-4 transition shadow-lg"
                                    matchEl.innerHTML = `
                                        <div class="flex-1 flex flex-col sm:flex-row sm:items-center gap-4">
                                            <div class="flex-1 min-w-0 space-y-2">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <span class="text-lg font-bold text-orange-400">${m.opponent}</span>
                                                    <span class="text-xs font-medium text-gray-400 bg-gray-900 px-2 py-0.5 rounded">${m.format}</span>
                                                    <input type="text" id="edit-week-${m.id}" value="${m.week || ''}" placeholder="${translations[currentLang].placeholderWeek}" class="bg-blue-950/60 text-blue-400 text-xs px-2 py-1 rounded border border-blue-900/50 font-semibold focus:outline-none focus:border-orange-500 w-28 text-center">
                                                </div>
                                                <input type="text" id="edit-notes-${m.id}" value="${m.notes || ''}" placeholder="${translations[currentLang].placeholderNote}" class="w-full max-w-md bg-gray-950 border border-gray-700 text-xs px-2.5 py-1.5 rounded text-gray-200 focus:outline-none focus:border-orange-500">
                                            </div>
                                            
                                            <div class="flex items-center gap-2 flex-wrap">
                                                <button onclick="toggleMustPlay(${m.id})" class="p-2 rounded-lg text-xs font-semibold transition ${m.mustPlay ? 'bg-red-600 text-white' : 'bg-gray-900 text-gray-400 hover:text-red-400 border border-gray-700'}" title="Označit jako dohrávku">🔥</button>
                                                <input type="date" id="edit-date-${m.id}" value="${m.date}" class="bg-gray-900 border border-gray-700 p-2 rounded text-sm text-gray-200 focus:outline-none focus:border-orange-500 w-36 text-center">
                                                <input type="time" id="edit-time-${m.id}" value="${m.time}" class="bg-gray-900 border border-gray-700 p-2 rounded text-sm text-gray-200 focus:outline-none focus:border-orange-500">
                                                
                                                <button onclick="clearMatchDateInEdit(${m.id})" class="bg-orange-600/10 hover:bg-orange-600/20 text-orange-400 border border-orange-900/40 p-2 rounded-lg text-xs font-bold transition" title="${translations[currentLang].tooltipCancelDate}">❌</button>
                                                
                                                <button onclick="toggleConfirmed(${m.id})" class="p-2 rounded-lg text-xs font-semibold transition border ${m.confirmed ? 'bg-emerald-600/20 text-emerald-400 border-emerald-500/40' : 'bg-gray-900 text-gray-500 border-gray-800 hover:text-gray-300'}" title="${translations[currentLang].lblConfirmedCheck}">👍</button>
                                            </div>
                                        </div>

                                        <div class="flex items-center gap-2 justify-end border-t md:border-none pt-2 md:pt-0 border-gray-700/40">
                                            <button onclick="saveMatchEdit(${m.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2 px-3 rounded-lg text-sm font-bold transition" title="Uložit změny">✔️</button>
                                            <button onclick="toggleEditMatch(${m.id})" class="bg-gray-700 hover:bg-gray-600 text-gray-300 p-2 px-3 rounded-lg text-sm transition" title="Zrušit úpravy">↩️</button>
                                            <button onclick="deleteMatch(${m.id})" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 p-2 px-2.5 rounded-lg text-sm font-semibold transition border border-red-900/40" title="Smazat zápas">🗑️</button>
                                        </div>
                                    `
                                } else {
                                    matchEl.className = "p-4 rounded-xl border bg-gray-800/60 border-gray-700/60 flex flex-col md:flex-row md:items-center justify-between gap-4 transition hover:border-gray-700"
                                    matchEl.innerHTML = `
                                        <div class="flex-1 flex flex-col sm:flex-row sm:items-center gap-4">
                                            <div class="flex-1 min-w-0">
                                                <div class="flex items-center gap-2 flex-wrap">
                                                    <span class="text-lg font-bold ${nameColorClass}">${m.opponent}</span>
                                                    <span class="text-xs font-medium text-gray-400 bg-gray-900 px-2 py-0.5 rounded">${m.format}</span>
                                                    ${isMatchCurrentWeekNeeded ? `<span class="text-xs font-bold text-yellow-400 bg-yellow-950/60 px-2 py-0.5 rounded border border-yellow-800/80 flex items-center gap-1 animate-pulse" title="Nutno domluvit termín na tento týden">⚠️ Nutno naplánovat</span>` : ''}
                                                    ${m.mustPlay ? `<span class="text-xs font-bold text-red-400 bg-red-950/60 px-2 py-0.5 rounded border border-red-800 flex items-center gap-1 animate-pulse">🔥 Dohrávka</span>` : ''}
                                                    ${m.week ? `<span class="text-xs text-blue-400 bg-blue-950/40 px-2 py-0.5 rounded border border-blue-900/30 font-semibold">${m.week}</span>` : ''}
                                                </div>
                                                ${m.notes ? `<p class="text-xs text-gray-400 mt-1 italic">📝 ${m.notes}</p>` : ''}
                                            </div>
                                            
                                            <div class="flex items-center gap-3 shrink-0">
                                                ${m.date ? `
                                                    <div class="bg-gray-900 px-3 py-1.5 rounded-lg border border-gray-800 text-center">
                                                        <span class="text-xs font-bold text-white">${formattedMatchDate}</span>
                                                        <span class="text-xs text-orange-400 font-semibold ml-1.5">${m.time || '--:--'}</span>
                                                        ${m.confirmed ? `<span class="ml-1 text-emerald-400 text-xs" title="Potvrzeno">👍</span>` : ''}
                                                    </div>
                                                    <button onclick="openGoogleCalendar(${m.id})" class="bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 p-2 rounded-lg text-xs font-semibold transition flex items-center gap-1" title="Přidat do Google Kalendáře">📅</button>
                                                ` : '<span class="text-xs text-gray-500 italic">Bez termínu</span>'}
                                            </div>
                                        </div>

                                        <div class="flex items-center gap-2 justify-end border-t md:border-none pt-2 md:pt-0 border-gray-700/40 shrink-0">
                                            <button onclick="toggleEditMatch(${m.id})" class="bg-orange-600/10 hover:bg-orange-600/20 text-orange-400 border border-orange-500/30 p-2 px-3 rounded-lg text-xs font-semibold transition flex items-center gap-1" title="Upravit zápas">
                                                ✏️
                                            </button>
                                        </div>
                                    `
                                }

                                matchesList.appendChild(matchEl)

                                if (isEditing) {
                                    const editDateEl = document.getElementById(`edit-date-${m.id}`)
                                    if (editDateEl) {
                                        setupDateInput(editDateEl)
                                        editDateEl.addEventListener('input', () => handleDatePlaceholder(editDateEl))
                                    }
                                }
                            })
                            leagueEl.appendChild(matchesList)
                        } else {
                            const dotSummary = document.createElement("div")
                            dotSummary.className = "px-3 py-1.5 bg-gray-900/10 flex gap-1.5 flex-wrap rounded-b-lg border-t border-gray-800/40"
                            compMatches.forEach(m => {
                                let dotColor = "bg-red-500"
                                if (m.date) {
                                    if (isCurrentCalendarWeek(m.date)) {
                                        dotColor = "bg-yellow-500"
                                    } else {
                                        dotColor = m.confirmed ? "bg-emerald-500" : "bg-red-500"
                                    }
                                }
                                const dot = document.createElement("span")
                                dot.className = `w-2 h-2 rounded-full ${dotColor}`
                                dot.title = `${m.opponent} (${m.date ? (m.confirmed ? 'Potvrzeno' : 'Nepotvrzeno') : 'Bez termínu'})`
                                dotSummary.appendChild(dot)
                            })
                            leagueEl.appendChild(dotSummary)
                        }
                        leaguesContainer.appendChild(leagueEl)
                    })
                    serverEl.appendChild(leaguesContainer)
                }
                container.appendChild(serverEl)
            })

            if (Object.keys(grouped).length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-500">${translations[currentLang].noServersLabel}</div>`
            }
        }

        document.getElementById("formFinalDeadline").addEventListener('input', function() { handleDatePlaceholder(this); })
        document.getElementById("formBulkStartDate").addEventListener('input', function() { handleDatePlaceholder(this); })

        translateUI()
        render()
    </script>
</body>
</html>
