<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Šipky - Kompletní Správa</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121214 }
        .sidebar-scroll::-webkit-scrollbar { width: 4px }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px }
        
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(53%) sepia(87%) saturate(1904%) hue-rotate(360deg) brightness(102%) contrast(106%);
            cursor: pointer;
        }
        input[type="date"]::-webkit-datetime-edit-fields-wrapper {
            opacity: var(--date-opacity, 1);
        }
        input[type="date"].empty-date::-webkit-datetime-edit {
            color: transparent !important;
        }
        input[type="date"].empty-date { position: relative; }
        input[type="date"].empty-date::before {
            content: attr(data-placeholder);
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #a1a1aa;
            font-size: 0.875rem;
            pointer-events: none;
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col shrink-0 text-gray-300">
            <div class="p-4 border-b border-gray-800 flex items-center justify-between gap-2">
                <button onclick="goHome()" id="btnHomeIcon" class="flex-1 bg-gray-900 hover:bg-gray-850 text-orange-500/60 hover:text-orange-450 rounded-lg border border-gray-800 flex items-center justify-center py-2.5 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                </button>
                <button onclick="setView('timeline')" id="btnTimelineIcon" class="flex-1 bg-gray-900 hover:bg-gray-850 text-orange-500/60 hover:text-orange-450 rounded-lg border border-gray-800 flex items-center justify-center py-2.5 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </button>
                <button onclick="toggleForm()" id="btnAddIcon" class="flex-1 bg-gray-900 hover:bg-gray-855 text-orange-500 hover:text-orange-400 rounded-lg border border-gray-800 flex items-center justify-center py-2.5 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                </button>
                <button onclick="undo()" id="undoBtn" disabled class="flex-1 bg-gray-900 text-gray-800 rounded-lg border border-gray-955 flex items-center justify-center py-2.5 transition-all opacity-30 cursor-not-allowed">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-4 sidebar-scroll" id="sidebarNav"></div>

            <div class="p-4 border-t border-gray-800 bg-gray-950 flex items-center justify-between gap-2">
                <button onclick="exportTxt()" id="btnExportIcon" title="Uložit do TXT (OneDrive)" class="flex-1 bg-gray-900 hover:bg-gray-850 text-orange-500/60 hover:text-orange-400 border border-gray-800 hover:border-orange-950/50 rounded-lg py-2.5 flex items-center justify-center transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V8l-4-4H8z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M12 14a3 3 0 100-6 3 3 0 000 6z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M6 20h12"></path></svg>
                </button>
                <label id="btnImportLabel" title="Nahrát TXT (OneDrive)" class="flex-1 bg-gray-900 hover:bg-gray-855 text-orange-500/60 hover:text-orange-400 border border-gray-800 hover:border-orange-950/50 rounded-lg py-2.5 flex items-center justify-center transition-all cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <input type="file" id="importTxtFile" accept=".txt" onchange="importTxt(event)" class="hidden">
                </label>
                <button onclick="openServerManager()" id="btnManageIcon" class="flex-1 bg-gray-900 hover:bg-gray-855 text-orange-500/60 hover:text-orange-400 border border-gray-800 hover:border-orange-950/50 rounded-lg py-2.5 flex items-center justify-center transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </aside>

        <!-- MAIN OBSAH -->
        <main class="flex-1 overflow-y-auto bg-[#121214] p-6 md:p-8">
            <header class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
                <h1 class="text-3xl font-bold text-orange-500" id="pageTitle" data-lang="mainTitle">🎯 Moje Šipkařské Ligy</h1>
                <div class="flex items-center gap-4">
                    <button onclick="toggleLanguage()" id="langSwitcher" class="text-2xl hover:scale-110 active:scale-95 transition select-none focus:outline-none">🇩🇪</button>
                </div>
            </header>

            <!-- FORMULÁŘ -->
            <div id="matchForm" class="hidden bg-gray-800 p-6 rounded-xl mb-8 border border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-orange-400" id="formTitle" data-lang="formTitleAdd">Přidat zápas</h2>
                    <div class="flex gap-2 bg-gray-900 p-1 rounded border border-gray-700 text-xs">
                        <button onclick="setFormMode('single')" id="mode-single" class="px-3 py-1 rounded bg-orange-600 font-semibold text-white" data-lang="formModeSingle">Jeden zápas</button>
                        <button onclick="setFormMode('bulk')" id="mode-bulk" class="px-3 py-1 rounded text-gray-400 hover:text-white font-semibold" data-lang="formModeBulk">Hromadně (celá liga)</button>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <select id="formServer" onchange="checkNewServer(this.value)" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500"></select>
                        <input type="text" id="formNewServerInput" placeholder="Název nového serveru" class="hidden mt-2 w-full bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500">
                    </div>

                    <input type="text" id="formComp" placeholder="Liga / Cup" class="bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500">
                    
                    <div class="md:col-span-2 bg-gray-900/40 p-4 rounded-lg border border-gray-700/60 space-y-2">
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider" data-lang="formMatchFormat">Formát zápasu & Délka</label>
                        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                            <select id="fmtType" onchange="autoCalcDuration()" class="bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                                <option value="BO">Best of (BO)</option>
                                <option value="First to">First to</option>
                            </select>
                            <input type="number" id="fmtNumber" oninput="autoCalcDuration()" placeholder="Číslo (např. 8)" class="bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                            <input type="text" id="fmtGame" placeholder="Hra (501, Cricket...)" value="501" class="bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                            <select id="fmtOut" class="bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                                <option value="DO" selected>DO (Double Out)</option>
                                <option value="SO">SO (Single Out)</option>
                                <option value="MO">MO (Master Out)</option>
                                <option value="DI DO">DI DO</option>
                            </select>
                            <input type="number" id="formDuration" placeholder="Délka (min)" class="bg-gray-900 border border-orange-500/60 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500 text-orange-400 font-bold" title="Předpokládaná délka zápasu v minutách">
                        </div>
                    </div>

                    <div class="md:col-span-2 bg-gray-900/40 p-4 rounded-lg border border-gray-700/60 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1" data-lang="formMaxWeekly">Max zápasů týdně</label>
                            <input type="number" id="formMaxWeekly" placeholder="Žádný limit" class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1" data-lang="formFinalDeadline">Konečná deadline (datum)</label>
                            <input type="date" id="formFinalDeadline" data-placeholder="dd.mm.rrrr" oninput="handleDatePlaceholder(this)" class="empty-date w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500 text-gray-200">
                        </div>
                    </div>

                    <div class="md:col-span-2 bg-gray-900/40 p-4 rounded-lg border border-gray-700/60 grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Discord (URL odkaz)</label>
                            <input type="url" id="formDiscordUrl" placeholder="https://discord.gg/..." class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500 text-gray-200">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Web / Tabulka / Pravidla (URL odkaz)</label>
                            <input type="url" id="formWebUrl" placeholder="https://..." class="w-full bg-gray-900 border border-gray-700 p-2.5 rounded-lg text-sm focus:outline-none focus:border-orange-500 text-gray-200">
                        </div>
                    </div>
                    
                    <select id="formType" class="bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500">
                        <option value="flexi" data-lang="optFlexi">Flexibilní zápas (odehraju kdykoliv)</option>
                        <option value="fixed" data-lang="optFixed">Pevné kolo / Týden</option>
                    </select>
                    
                    <div id="singleWeekContainer">
                        <input type="text" id="formWeek" placeholder="Kolo / Týden" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500">
                    </div>

                    <div id="singleOpponentContainer" class="w-full">
                        <input type="text" id="formOpponent" placeholder="Soupeř" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500">
                    </div>
                    
                    <div id="bulkContainer" class="hidden md:col-span-2 space-y-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-1" data-lang="formBulkDateLabel">Datum prvního týdne (pro automatické rozpočítání po týdnech):</label>
                            <input type="date" id="formBulkStartDate" data-placeholder="dd.mm.rrrr" oninput="handleDatePlaceholder(this)" class="empty-date bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500 text-gray-200">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-1" data-lang="formOpponentsLabel">Seznam soupeřů (každé jméno na nový řádek):</label>
                            <textarea id="formOpponentsList" rows="5" placeholder="Pavel&#10;Honza&#10;Jan" class="w-full bg-gray-900 border border-gray-700 p-3 rounded-lg focus:outline-none focus:border-orange-500 font-mono text-sm"></textarea>
                        </div>
                        <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer select-none bg-gray-900/50 p-3 rounded-lg border border-gray-700/60 w-max">
                            <input type="checkbox" id="formRematches" class="accent-orange-500 h-4 w-4">
                            <span data-lang="formRematchesLabel">Včetně odvet (zduplikovat celý seznam jako druhé kolo)</span>
                        </label>
                    </div>
                </div>
                
                <div class="flex gap-3 mt-4 justify-end">
                    <button onclick="toggleForm()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-semibold" data-lang="btnCancel">Zrušit</button>
                    <button onclick="saveFromForm()" class="bg-orange-600 hover:bg-orange-500 px-4 py-2 rounded-lg font-semibold text-white" data-lang="btnSave">Uložit</button>
                </div>
            </div>

            <!-- FILTRY -->
            <div id="filterContainer" class="hidden mb-6 flex gap-3 p-3 bg-gray-900 rounded-lg border border-gray-800">
                <select id="filterServer" onchange="render()" class="bg-gray-800 border border-gray-700 p-2 rounded text-sm text-gray-300 focus:outline-none focus:border-orange-500">
                    <option value="all">Všechny servery</option>
                </select>
                <select id="filterComp" onchange="render()" class="bg-gray-800 border border-gray-700 p-2 rounded text-sm text-gray-300 focus:outline-none focus:border-orange-500">
                    <option value="all">Všechny ligy</option>
                </select>
            </div>

            <!-- KONTEJNER PRO OBSAH -->
            <div id="mainContentContainer" class="space-y-6"></div>
        </main>
    </div>

    <script>
        const translations = {
            cs: {
                homeBtn: "Domů / Rozcestník",
                timelineBtn: "Aktuální zápasy",
                undoBtn: "Zpět",
                manageServersBtn: "Spravovat servery",
                mainTitle: "🎯 Moje Šipkařské Ligy",
                timelineTitle: "🗓️ Aktuální zápasy",
                addMatchBtn: "Přidat zápas / ligu",
                formTitleAdd: "Přidat zápas",
                formModeSingle: "Jeden zápas",
                formModeBulk: "Hromadně (celá liga)",
                optNewServer: "+ Nový server...",
                formMatchFormat: "Formát zápasu & Délka",
                formMaxWeekly: "Max zápasů týdně",
                formFinalDeadline: "Konečná deadline (datum)",
                optFlexi: "Flexibilní zápas (odehraju kdykoliv)",
                optFixed: "Pevné kolo / Týden",
                formBulkDateLabel: "Datum prvního týdne (pro automatické rozpočítání po týdnech):",
                formOpponentsLabel: "Seznam soupeřů (každé jméno na nový řádek):",
                formRematchesLabel: "Včetně odvet (zduplikovat celý seznam jako druhé kolo)",
                btnCancel: "Zrušit",
                btnSave: "Uložit",
                btnDeleteSelected: "Smazat vybrané",
                btnSaveClose: "Uložit a zavřít",
                modalManageServers: "Spravovat servery a pořadí",
                serverLabelEmpty: "Tento server je prázdný.",
                emptyMatchesLabel: "Žádné domluvené zápasy.",
                confrimDeleteMatch: "Opravdu smazat zápas?",
                lblDeadline: "Do:",
                lblMaxWeekly: "Limit:",
                placeholderNote: "Poznámka...",
                lblConfirmedCheck: "Potvrzeno?",
                tooltipEdit: "Upravit zápas",
                tooltipGCal: "Přidat do Google Kalendáře",
                btnAddMatchToLeague: "+ Přidat zápas do této ligy"
            },
            de: {
                homeBtn: "Hauptmenü / Übersicht",
                timelineBtn: "Aktuelle Spiele",
                undoBtn: "Rückgängig",
                manageServersBtn: "Server verwalten",
                mainTitle: "🎯 Meine Darts-Ligen",
                timelineTitle: "🗓️ Aktuelle Spiele",
                addMatchBtn: "Spiel / Liga hinzufügen",
                formTitleAdd: "Spiel hinzufügen",
                formModeSingle: "Einzelnes Spiel",
                formModeBulk: "Massenhaft (ganze Liga)",
                optNewServer: "+ Neuer Server...",
                formMatchFormat: "Spielformat & Dauer",
                formMaxWeekly: "Max. Spiele pro Woche",
                formFinalDeadline: "Endgültige Deadline (Datum)",
                optFlexi: "Flexibles Spiel (jederzeit spielbar)",
                optFixed: "Feste Spielwoche / Runde",
                formBulkDateLabel: "Datum der ersten Woche:",
                formOpponentsLabel: "Gegnerliste:",
                formRematchesLabel: "Inklusive Rückspiele",
                btnCancel: "Abbrechen",
                btnSave: "Speichern",
                btnDeleteSelected: "Löschen",
                btnSaveClose: "Speichern & Schließen",
                modalManageServers: "Server verwalten",
                serverLabelEmpty: "Dieser Server ist leer.",
                emptyMatchesLabel: "Keine vereinbarten Spiele.",
                confrimDeleteMatch: "Spiel wirklich löschen?",
                lblDeadline: "Bis:",
                lblMaxWeekly: "Limit:",
                placeholderNote: "Notiz...",
                lblConfirmedCheck: "Bestätigt?",
                tooltipEdit: "Spiel bearbeiten",
                tooltipGCal: "Zu Google Kalender hinzufügen",
                btnAddMatchToLeague: "+ Spiel zu dieser Liga hinzufügen"
            }
        }

        let currentLang = localStorage.getItem("dartLang") || "cs"
        let matches = JSON.parse(localStorage.getItem("dartMatchesV23")) || []
        let closedStates = JSON.parse(localStorage.getItem("dartClosedStatesV23")) || {}
        let editingMatchIds = new Set()
        let historyStack = []
        let currentView = "home"
        let hiddenServers = JSON.parse(localStorage.getItem("dartHiddenServersV23")) || []

        function setView(view) {
            currentView = view
            document.getElementById("filterContainer").classList.toggle("hidden", view !== "timeline")
            render()
        }

        function toggleConfirmed(id) {
            const match = matches.find(m => m.id === id)
            if (match) {
                match.confirmed = !match.confirmed
                save()
            }
        }

        function save(skipRender = false) {
            localStorage.setItem("dartMatchesV23", JSON.stringify(matches))
            if (!skipRender) render()
        }

        function render() {
            const container = document.getElementById("mainContentContainer")
            container.innerHTML = ""

            // Update filtrů
            const fS = document.getElementById("filterServer")
            const fC = document.getElementById("filterComp")
            
            if (currentView === "timeline") {
                let timelineMatches = matches.filter(m => (m.date || m.mustPlay) && !hiddenServers.includes(m.server))
                
                // Filtrování
                if (fS.value !== "all") timelineMatches = timelineMatches.filter(m => m.server === fS.value)
                if (fC.value !== "all") timelineMatches = timelineMatches.filter(m => m.comp === fC.value)

                timelineMatches.forEach(m => {
                    const card = document.createElement("div")
                    const isEditing = editingMatchIds.has(m.id)
                    card.className = "bg-gray-900 p-4 rounded-xl border border-gray-800 flex justify-between items-center"
                    
                    if (isEditing) {
                        card.innerHTML = `
                            <div class="flex-1 space-y-2">
                                <span class="text-lg font-bold text-orange-400">${m.opponent}</span>
                                <div class="flex gap-2">
                                    <input type="date" id="edit-date-${m.id}" value="${m.date}" class="bg-gray-800 p-2 rounded">
                                    <input type="time" id="edit-time-${m.id}" value="${m.time}" class="bg-gray-800 p-2 rounded">
                                    <button onclick="toggleConfirmed(${m.id})" class="p-2 ${m.confirmed ? 'bg-emerald-600' : 'bg-gray-700'} rounded">👍</button>
                                    <button onclick="saveMatchEdit(${m.id})" class="bg-emerald-600 p-2 rounded">✔️</button>
                                </div>
                            </div>
                        `
                    } else {
                        card.innerHTML = `
                            <div>
                                <p class="text-sm font-black text-white">${m.date ? m.date : 'Bez termínu'}</p>
                                <p class="text-lg font-bold">${m.opponent}</p>
                            </div>
                            <button onclick="toggleEditMatch(${m.id})" class="text-orange-400">✏️</button>
                        `
                    }
                    container.appendChild(card)
                })
            }
        }

        function saveMatchEdit(id) {
            const match = matches.find(m => m.id === id)
            if (match) {
                const d = document.getElementById(`edit-date-${id}`)
                const t = document.getElementById(`edit-time-${id}`)
                if(d) match.date = d.value
                if(t) match.time = t.value
                editingMatchIds.delete(id)
                save()
            }
        }
        
        // Inicializace filtrů při startu
        function initFilters() {
            const servers = [...new Set(matches.map(m => m.server))]
            const fS = document.getElementById("filterServer")
            servers.forEach(s => fS.innerHTML += `<option value="${s}">${s}</option>`)
        }

        initFilters()
        render()
    </script>
</body>
</html>
