<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Šipkařské Ligy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121214; }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(53%) sepia(87%) saturate(1904%) hue-rotate(360deg) brightness(102%) contrast(106%);
            cursor: pointer;
        }
        input[type="date"]::-webkit-datetime-edit-fields-wrapper { opacity: var(--date-opacity, 1); }
        input[type="date"].empty-date::-webkit-datetime-edit { color: transparent !important; }
        input[type="date"].empty-date { position: relative; }
        input[type="date"].empty-date::before {
            content: attr(data-placeholder);
            position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
            color: #a1a1aa; font-size: 0.875rem; pointer-events: none;
        }
    </style>
</head>
<body class="bg-[#121214] text-gray-100 min-h-screen flex flex-col">

    <!-- Horní lišta / Navigace (Upevněná na stálo) -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center shadow-md sticky top-0 z-40">
        <div class="flex items-center space-x-3">
            <button onclick="goHome()" id="btnHomeIcon" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-orange-400 flex items-center justify-center transition cursor-pointer text-lg" title="Domů / Rozcestník">🏠</button>
            <button onclick="setView('timeline')" id="btnTimelineIcon" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-orange-400 flex items-center justify-center transition cursor-pointer text-lg" title="Aktuální zápasy">🗓️</button>
            <h1 id="pageTitle" class="text-xl font-bold text-orange-500 tracking-wide ml-2">🎯 Moje Šipkařské Ligy</h1>
        </div>
        
        <div class="flex items-center space-x-2">
            <button onclick="undo()" id="undoBtn" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-gray-400 flex items-center justify-center transition cursor-pointer opacity-30 cursor-not-allowed" title="Zpět">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a5 5 0 015 5v2M3 10l6 6m-6-6l6-6"/></svg>
            </button>

            <button onclick="toggleForm()" id="btnAddIcon" class="w-10 h-10 bg-orange-600 hover:bg-orange-500 rounded-lg text-white flex items-center justify-center transition cursor-pointer shadow-lg shadow-orange-600/20" title="Přidat zápas / ligu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            </button>
            
            <label class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-emerald-400 flex items-center justify-center transition cursor-pointer" title="Import TXT">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                <input type="file" accept=".txt" onchange="importTxt(event)" class="hidden">
            </label>

            <button onclick="exportTxt()" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-blue-400 flex items-center justify-center transition cursor-pointer" title="Export TXT">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            </button>

            <button onclick="openServerManager()" id="btnManageIcon" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-gray-300 flex items-center justify-center transition cursor-pointer" title="Spravovat servery">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756.2924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </button>

            <button onclick="toggleLanguage()" id="langSwitcher" class="w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-xs font-bold text-gray-200 flex items-center justify-center transition cursor-pointer">🇩🇪</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Levý sloupec pevně upevněný na stálo -->
        <aside class="w-64 bg-gray-950 border-r border-gray-800 p-4 hidden md:block sidebar-scroll sticky top-[73px] h-[calc(100vh-73px)] overflow-y-auto shrink-0">
            <div id="sidebarNav" class="space-y-4"></div>
        </aside>

        <main class="flex-1 p-6 overflow-y-auto space-y-6">
            <!-- Formulář pro přidání -->
            <div id="matchForm" class="hidden bg-gray-900 p-5 rounded-xl border border-orange-500/40 shadow-xl space-y-4 max-w-4xl">
                <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                    <h3 id="formTitle" class="text-lg font-bold text-orange-400">Přidat zápas</h3>
                    <div class="flex gap-1 bg-gray-950 p-1 rounded-lg border border-gray-800 text-xs">
                        <button type="button" id="mode-single" onclick="setFormMode('single')" class="px-3 py-1.5 rounded-md bg-orange-600 font-semibold text-white transition">Jeden zápas</button>
                        <button type="button" id="mode-bulk" onclick="setFormMode('bulk')" class="px-3 py-1.5 rounded-md text-gray-400 font-semibold hover:text-white transition">Hromadně (celá liga)</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Server</label>
                        <select id="formServer" onchange="checkNewServer(this.value)" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-orange-500"></select>
                        <input type="text" id="formNewServerInput" placeholder="Název nového serveru..." class="hidden w-full mt-2 bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Liga / Cup</label>
                        <input type="text" id="formComp" placeholder="Liga / Cup (např. Cup 6c, Liga Division E)" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-orange-500">
                    </div>
                </div>

                <!-- Formát zápasu & délka -->
                <div class="bg-gray-950/40 p-3.5 rounded-xl border border-gray-800 space-y-2">
                    <label class="block text-[11px] text-orange-400 uppercase font-bold tracking-wider">Formát zápasu & Délka</label>
                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
                        <select id="formFormatType" class="bg-gray-800 border border-gray-700 p-2 rounded-lg text-xs text-gray-200">
                            <option value="BO">Best of (BO)</option>
                            <option value="FT">First to (FT)</option>
                        </select>
                        <input type="text" id="formFormatNum" value="8" oninput="updateDefaultDuration()" placeholder="Číslo (např. 8)" class="bg-gray-800 border border-gray-700 p-2 rounded-lg text-xs text-gray-200 text-center">
                        <input type="text" id="formGameVariant" value="501" placeholder="501 / Cricket..." class="bg-gray-800 border border-gray-700 p-2 rounded-lg text-xs text-gray-200 text-center">
                        <select id="formOutVariant" class="bg-gray-800 border border-gray-700 p-2 rounded-lg text-xs text-gray-200">
                            <option value="DO">DO (Double Out)</option>
                            <option value="SO">SO (Single Out)</option>
                            <option value="MO">MO (Master Out)</option>
                        </select>
                        <input type="text" id="formDuration" value="30" placeholder="Minuty" class="bg-gray-800 border border-gray-700 p-2 rounded-lg text-xs text-orange-400 font-bold text-center" title="Automaticky vypočteno podle formátu">
                    </div>
                </div>

                <!-- Max zápasů & Deadline -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Max zápasů týdně</label>
                        <input type="text" id="formMaxWeekly" placeholder="Žádný limit" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Konečná Deadline (Datum)</label>
                        <input type="date" id="formFinalDeadline" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                    </div>
                </div>

                <!-- Odkazy Discord & Web -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Discord (URL odkaz)</label>
                        <input type="text" id="formDiscordUrl" placeholder="https://discord.gg/..." class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Web / Tabulka / Pravidla (URL odkaz)</label>
                        <input type="text" id="formWebUrl" placeholder="https://..." class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                    </div>
                </div>

                <!-- Režim pro jeden zápas (+ Odveta) -->
                <div id="singleOpponentContainer" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Typ / Kolo zápasu</label>
                            <select id="formMatchType" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                                <option value="flexi">Flexibilní zápas (odehraji kdykoliv)</option>
                                <option value="fixed">Pevné kolo / termín</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Kolo / Týden</label>
                            <input type="text" id="formWeek" placeholder="Kolo / Týden..." class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Soupeř</label>
                        <input type="text" id="formOpponent" placeholder="Soupeř..." class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                    </div>
                    <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer select-none bg-gray-950/50 p-3 rounded-lg border border-gray-800 w-max">
                        <input type="checkbox" id="formSingleRematch" class="accent-orange-600 h-4 w-4">
                        <span>Včetně odvety (vytvořit rovnou 2 vzájemné zápasy)</span>
                    </label>
                </div>

                <!-- Režim pro hromadné přidání celé ligy -->
                <div id="bulkContainer" class="hidden space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Typ zápasů v lize</label>
                            <select id="formBulkMatchType" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                                <option value="fixed">Pevné termíny / kola</option>
                                <option value="flexi">Flexibilní zápasy</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Výchozí Kolo / Týden (např. Kolo 1)</label>
                            <input type="text" id="formBulkWeek" placeholder="Kolo 1 / 1. týden..." class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Datum prvního týdne (pro rozpočítání):</label>
                        <input type="date" id="formBulkStartDate" class="w-full sm:w-1/2 bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Seznam soupeřů (každé jméno na nový řádek):</label>
                        <textarea id="formOpponentsList" rows="5" placeholder="Hráč 1&#10;Hráč 2&#10;Hráč 3" class="w-full bg-gray-800 border border-gray-700 p-2.5 rounded-lg text-sm text-gray-200 focus:outline-none focus:border-orange-500 font-mono"></textarea>
                    </div>
                    <label class="flex items-center gap-2 text-sm text-gray-300 cursor-pointer select-none bg-gray-950/50 p-3 rounded-lg border border-gray-800 w-max">
                        <input type="checkbox" id="formRematches" class="accent-orange-600 h-4 w-4">
                        <span>Včetně odvet (zduplikovat celý seznam jako druhé kolo)</span>
                    </label>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-gray-800">
                    <button type="button" onclick="toggleForm()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm text-gray-300 font-semibold transition">Zrušit</button>
                    <button type="button" onclick="saveFromForm()" class="px-4 py-2 bg-orange-600 hover:bg-orange-500 rounded-lg text-sm text-white font-bold transition">Uložit</button>
                </div>
            </div>

            <div id="filterContainer" class="hidden"></div>
            <div id="mainContentContainer" class="space-y-6"></div>
        </main>
    </div>

    <!-- Modální okno pro smazání lig -->
    <div id="leagueDeleteModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-red-400">Smazat server / ligy</h3>
            <p class="text-sm text-gray-300">Opravdu chceš smazat celý server <span id="leagueDeleteServerDesc" class="font-bold text-orange-400"></span>?</p>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeLeagueDeleteModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded-lg text-sm font-semibold transition">Zrušit</button>
                <button onclick="confirmLeagueDeletes()" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-lg text-sm font-bold transition">Smazat</button>
            </div>
        </div>
    </div>

    <!-- SKRIPT OBSAHUJÍCÍ VŠECHNU LOGIKU -->
    <script>
        const translations = {
            cs: {
                homeBtn: "Domů / Rozcestník", timelineBtn: "Aktuální zápasy", undoBtn: "Zpět", manageServersBtn: "Spravovat servery",
                mainTitle: "🎯 Moje Šipkařské Ligy", timelineTitle: "🗓️ Aktuální zápasy", addMatchBtn: "Přidat zápas / ligu",
                formTitleAdd: "Přidat zápas", formModeSingle: "Jeden zápas", formModeBulk: "Hromadně (celá liga)",
                optNewServer: "+ Nový server...", formMatchFormat: "Formát zápasu & Délka",
                emptyMatchesLabel: "Žádné domluvené ani označené zápasy k dohrávce.", lblConfirmedCheck: "Potvrzeno?",
                placeholderWeek: "Kolo / Týden", placeholderDateInput: "dd.mm.rrrr", termLabel: "TERMÍN",
                noTermLabel: "Bez termínu", mustPlayLabel: "🔥 Dohrávka", tooltipClose: "Zavřít",
                tooltipSave: "Uložit změny", tooltipDelete: "Smazat zápas", tooltipEdit: "Upravit zápas",
                tooltipGCal: "Přidat do Google Kalendáře", badgeEditTitle: "Úprava", btnAddMatchToLeague: "+ Přidat zápas do této ligy"
            },
            de: {
                homeBtn: "Hauptmenü / Übersicht", timelineBtn: "Aktuelle Spiele", undoBtn: "Rückgängig", manageServersBtn: "Server verwalten",
                mainTitle: "🎯 Meine Darts-Ligen", timelineTitle: "🗓️ Aktuelle Spiele", addMatchBtn: "Spiel / Liga hinzufügen",
                formTitleAdd: "Spiel hinzufügen", formModeSingle: "Einzelnes Spiel", formModeBulk: "Massenhaft (ganze Liga)",
                optNewServer: "+ Neuer Server...", formMatchFormat: "Spielformat & Dauer",
                emptyMatchesLabel: "Keine vereinbarten oder zum Nachholen markierten Spiele.", lblConfirmedCheck: "Bestätigt?",
                placeholderWeek: "Runde / Woche", placeholderDateInput: "tt.mm.jjjj", termLabel: "TERMIN",
                noTermLabel: "Kein Termin", mustPlayLabel: "🔥 Nachholspiel", tooltipClose: "Schließen",
                tooltipSave: "Änderungen speichern", tooltipDelete: "Spiel löschen", tooltipEdit: "Spiel bearbeiten",
                tooltipGCal: "Zu Google Kalender hinzufügen", badgeEditTitle: "Bearbeiten", btnAddMatchToLeague: "+ Spiel zu dieser Liga hinzufügen"
            }
        };

        let matches = JSON.parse(localStorage.getItem("dartMatchesV23")) || [];
        let emptyServers = JSON.parse(localStorage.getItem("dartEmptyServersV23")) || [];
        let emptyLeagues = JSON.parse(localStorage.getItem("dartEmptyLeaguesV23")) || [];
        let hiddenServers = JSON.parse(localStorage.getItem("dartHiddenServersV23")) || [];
        let serverOrder = JSON.parse(localStorage.getItem("dartServerOrderV23")) || [];
        let closedStates = JSON.parse(localStorage.getItem("dartClosedStatesV23")) || {};
        let historyStack = [];

        let currentLang = localStorage.getItem("dartLang") || "cs";
        let editingMatchIds = new Set();
        let currentView = "home";
        let formMode = "single";
        let activeDeleteServerName = "";

        function pushToHistory() {
            const state = { matches: JSON.parse(JSON.stringify(matches)), emptyServers, emptyLeagues, hiddenServers, serverOrder };
            historyStack.push(JSON.stringify(state));
            if (historyStack.length > 20) historyStack.shift();
            updateUndoButton();
        }

        function undo() {
            if (historyStack.length === 0) return;
            const prev = JSON.parse(historyStack.pop());
            matches = prev.matches; emptyServers = prev.emptyServers; emptyLeagues = prev.emptyLeagues || []; hiddenServers = prev.hiddenServers; serverOrder = prev.serverOrder || [];
            save(false);
        }

        function updateUndoButton() {
            const btn = document.getElementById("undoBtn");
            if (!btn) return;
            if (historyStack.length > 0) {
                btn.disabled = false; btn.className = "w-10 h-10 bg-gray-800 hover:bg-gray-700 rounded-lg text-orange-400 flex items-center justify-center transition cursor-pointer";
            } else {
                btn.disabled = true; btn.className = "w-10 h-10 bg-gray-800 text-gray-800 rounded-lg border border-gray-955 flex items-center justify-center transition-all opacity-30 cursor-not-allowed";
            }
        }

        function save(skipRender = false) {
            localStorage.setItem("dartMatchesV23", JSON.stringify(matches));
            localStorage.setItem("dartEmptyServersV23", JSON.stringify(emptyServers));
            localStorage.setItem("dartEmptyLeaguesV23", JSON.stringify(emptyLeagues));
            localStorage.setItem("dartHiddenServersV23", JSON.stringify(hiddenServers));
            localStorage.setItem("dartServerOrderV23", JSON.stringify(serverOrder));
            localStorage.setItem("dartClosedStatesV23", JSON.stringify(closedStates));
            updateUndoButton();
            if (!skipRender && typeof render === 'function') render();
        }

        function toggleLanguage() { setLanguage(currentLang === "cs" ? "de" : "cs"); }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem("dartLang", lang);
            const sw = document.getElementById("langSwitcher");
            if(sw) sw.innerText = lang === "cs" ? "🇩🇪" : "🇨🇿";
            translateUI();
            render();
        }

        function handleDatePlaceholder(input) {
            if (!input) return;
            if (input.value) { input.classList.remove("empty-date"); input.style.setProperty("--date-opacity", "1"); }
            else { input.classList.add("empty-date"); input.style.setProperty("--date-opacity", "0"); }
        }

        function setupDateInput(input) {
            if (!input || !translations[currentLang]) return;
            input.setAttribute("data-placeholder", translations[currentLang].placeholderDateInput);
            handleDatePlaceholder(input);
        }

        function translateUI() {
            document.querySelectorAll("[data-lang]").forEach(el => {
                const key = el.getAttribute("data-lang");
                if (translations[currentLang][key]) el.innerText = translations[currentLang][key];
            });
            const fc = document.getElementById("formComp");
            if(fc) fc.placeholder = currentLang === "cs" ? "Liga / Cup (např. Cup 6c, Liga Division E)" : "Liga / Cup (z.B. Cup 6c, Liga Division E)";
            const fw = document.getElementById("formWeek");
            if(fw) fw.placeholder = translations[currentLang].placeholderWeek;
            const fo = document.getElementById("formOpponent");
            if(fo) fo.placeholder = currentLang === "cs" ? "Soupeř" : "Gegner";

            const setElTitle = (id, val) => { const el = document.getElementById(id); if(el) el.title = val; };
            setElTitle("btnHomeIcon", translations[currentLang].homeBtn);
            setElTitle("btnTimelineIcon", translations[currentLang].timelineBtn);
            setElTitle("undoBtn", translations[currentLang].undoBtn);
            setElTitle("btnAddIcon", translations[currentLang].addMatchBtn);
            setElTitle("btnManageIcon", translations[currentLang].manageServersBtn);
        }

        function getLegsFromFormat(formatStr) {
            if (!formatStr) return 7;
            const fmtLower = formatStr.toLowerCase();
            const matchNum = fmtLower.match(/\d+/);
            if (!matchNum) return 7;
            const num = parseInt(matchNum[0]);
            if (fmtLower.includes("first to") || fmtLower.includes("race to")) return (2 * num) - 1;
            return num;
        }

        function calculateDurationMinutes(formatStr) {
            const legs = getLegsFromFormat(formatStr);
            if (legs <= 8) return 30;
            if (legs <= 11) return 45;
            return 60;
        }

        function updateDefaultDuration() {
            const type = document.getElementById("formFormatType").value;
            const num = document.getElementById("formFormatNum").value.trim();
            const variant = document.getElementById("formGameVariant").value.trim();
            const out = document.getElementById("formOutVariant").value;
            const dummyFormat = `${type} ${num} ${variant} ${out}`;
            const dur = calculateDurationMinutes(dummyFormat);
            const durEl = document.getElementById("formDuration");
            if (durEl) durEl.value = dur;
        }

        function toggleMustPlay(id) { pushToHistory(); const match = matches.find(m => m.id === id); if (match) { match.mustPlay = !match.mustPlay; save(); } }
        function toggleConfirmed(id) { pushToHistory(); const match = matches.find(m => m.id === id); if (match) { match.confirmed = !match.confirmed; save(); } }

        function openGoogleCalendar(id) {

            if (match.time) {
                const parts = match.time.split(":");
                const startHour = parseInt(parts[0]), startMin = parseInt(parts[1]);
                const startDateObj = new Date(match.date); startDateObj.setHours(startHour, startMin, 0);
                const endDateObj = new Date(startDateObj.getTime() + duration * 60000);
                const pad = (n) => n.toString().padStart(2, "0");
                startIso = `${cleanDate}T${pad(startHour)}${pad(startMin)}00`;
                endIso = `${endDateObj.getFullYear()}${pad(endDateObj.getMonth() + 1)}${pad(endDateObj.getDate())}T${pad(endDateObj.getHours())}${pad(endDateObj.getMinutes())}00`;
            }
            const title = encodeURIComponent(`🎯 [${match.server}] ${match.comp} - ${match.format} - ${match.opponent}`);
            let detailsText = `Soupeř: ${match.opponent}\nFormát: ${match.format}\nServer: ${match.server}\nLiga: ${match.comp}\nDélka: ${duration} min`;
            if (match.week) detailsText += `\nKolo: ${match.week}`;
            if (match.notes) detailsText += `\nPoznámka: ${match.notes}`;
            window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startIso}/${endIso}&details=${encodeURIComponent(detailsText)}`, '_blank');
        }

        function importTxt(event) {
            const file = event.target.files[0]; if (!file) return;

            reader.readAsText(file);
        }

        function parseTxtData(textText) {
            pushToHistory(); const newMatches = [];
            const blocks = textText.split(/----+/).map(b => b.trim()).filter(b => b.length > 0);
            blocks.forEach((block, bIdx) => {
                const lines = block.split("\n").map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length === 0) return;
                const headerParts = lines[0].split("->").map(p => p.trim());
                let server = "", compFull = "", format = "BO 8 501 DO", weekInfo = "", webUrl = "", discordUrl = "";
                headerParts.forEach(part => { if (part.startsWith("http")) { if (part.includes("discord")) discordUrl = part; else webUrl = part; } });
                const nonUrlParts = headerParts.filter(p => !p.startsWith("http"));
                if (nonUrlParts.length >= 3) { server = nonUrlParts[0]; compFull = nonUrlParts[1]; format = nonUrlParts[2] || format; if (nonUrlParts[3]) weekInfo = nonUrlParts[3]; }
                else {
                    compFull = nonUrlParts[0] || "Liga"; format = nonUrlParts[1] || format; if (nonUrlParts[2]) weekInfo = nonUrlParts[2];
                    const combined = `${compFull} ${webUrl} ${discordUrl}`.toLowerCase();
                    if (combined.includes("edc")) server = "EDC";
                    else if (combined.includes("scolia")) server = "Scolia Checkout Community";
                    else if (combined.includes("dartfan")) server = "Dartfan online";
                    else if (combined.includes("hood")) server = "HOOD";
                    else if (combined.includes("dbf")) server = "DBF";
                    else server = "Ostatní";
                }
                const duration = calculateDurationMinutes(format);
                lines.slice(1).forEach((mLine, mIdx) => {
                    if (!mLine.startsWith("-")) return;
                    const matchParts = mLine.replace(/^-/, "").trim().split("->").map(p => p.trim());
                    const opponent = matchParts[0];
                    let date = "", time = "", confirmed = false, mustPlay = false, week = weekInfo, notes = "";
                    matchParts.slice(1).forEach(part => {
                        if (part.includes("🔥")) mustPlay = true;
                        else if (part.startsWith("W:")) week = part.replace("W:", "").trim();
                        else if (part.startsWith("NOTE:")) notes = part.replace("NOTE:", "").trim();
                        else {
                            const dtMatch = part.match(/(\d{1,2})\.(\d{1,2})\.?(?:\s+(\d{1,2}:\d{2}))?/);
                            if (dtMatch) {
                                date = `${new Date().getFullYear()}-${dtMatch[2].padStart(2, '0')}-${dtMatch[1].padStart(2, '0')}`;
                                if (dtMatch[3]) time = dtMatch[3]; confirmed = true;
                            }
                        }
                    });
                    newMatches.push({ id: Date.now() + (bIdx * 100) + mIdx, server, comp: compFull, opponent, format, duration, type: week ? "fixed" : "flexi", week, date, time, confirmed, mustPlay, status: date ? "scheduled" : "unscheduled", notes, maxWeekly: "", finalDeadline: "", discordUrl, webUrl });
                });
            });
            if (newMatches.length > 0) { matches = newMatches; save(); alert("TXT načten!"); }
        }

        function exportTxt() {
            const grouped = {};
            matches.forEach(m => { const key = `${m.server}::${m.comp}`; if (!grouped[key]) grouped[key] = []; grouped[key].push(m); });
            let txtContent = "";
            Object.keys(grouped).forEach((key, idx) => {
                const compMatches = grouped[key], first = compMatches[0];
                let header = `${first.server} -> ${first.comp}`;
                if (first.format) header += ` -> ${first.format}`;
                if (first.week) header += ` -> ${first.week}`;
                if (first.webUrl) header += ` -> ${first.webUrl}`;
                if (first.discordUrl) header += ` -> ${first.discordUrl}`;
                txtContent += `${header}\n`;
                compMatches.forEach(m => {
                    let line = `- ${m.opponent}`;
                    if (m.date) { const parts = m.date.split("-"); line += ` -> ${parts[2]}.${parts[1]}.`; if (m.time) line += ` ${m.time}`; } else { line += ` -> `; }
                    if (m.mustPlay) line += ` -> 🔥`; if (m.week) line += ` -> W: ${m.week}`; if (m.notes) line += ` -> NOTE: ${m.notes}`;
                    txtContent += `${line}\n`;
                });
                if (idx < Object.keys(grouped).length - 1) txtContent += `\n---------------------------------------------------------------------------\n\n`;
            });
            const blob = new Blob([txtContent], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "Šipky zápasy.txt"; link.click();
        }

        function isCurrentCalendarWeek(dateStr) {
            if (!dateStr) return false;
            const d = new Date(dateStr); const now = new Date();
            return Math.abs(d - now) / (1000 * 60 * 60 * 24) <= 7;
        }

        function isWeekInPastOrCurrent(wStr) {
            if (!wStr) return false;
            const match = wStr.match(/(\d{1,2})\.(\d{1,2})\./); if (!match) return false;
            const day = parseInt(match[1]); const month = parseInt(match[2]);
            const now = new Date(); let year = now.getFullYear();
            if (now.getMonth() >= 6 && month <= 2) year += 1;
            return now > new Date(year, month - 1, day);
        }

                                <input type="date" id="edit-date-${m.id}" value="${m.date}" class="bg-gray-800 border border-gray-700 p-2 rounded text-sm text-gray-200 focus:outline-none focus:border-orange-500 w-36 text-center">
                                <input type="time" id="edit-time-${m.id}" value="${m.time}" class="bg-gray-800 border border-gray-700 p-2 rounded text-sm text-gray-200 focus:outline-none focus:border-orange-500">
                                <button type="button" onclick="clearMatchDateInEdit(${m.id})" class="bg-orange-600/10 hover:bg-orange-600/20 text-orange-400 border border-orange-900/40 p-2 rounded-lg text-xs font-bold transition" title="Vymazat termín">🧹</button>
                                <button type="button" onclick="toggleConfirmed(${m.id})" class="p-2 rounded-lg text-xs font-semibold transition border ${m.confirmed ? 'bg-emerald-600/20 text-emerald-400 border-emerald-500/40' : 'bg-gray-800 text-gray-500 border-gray-700 hover:text-gray-300'}" title="${translations[currentLang].lblConfirmedCheck}">👍</button>
                                <button type="button" onclick="saveMatchEdit(${m.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2 px-3 rounded-lg text-sm font-bold transition" title="${translations[currentLang].tooltipSave}">✔️</button>
                                <button type="button" onclick="deleteMatch(${m.id})" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-900/40 p-2 px-2.5 rounded-lg text-sm font-semibold transition" title="${translations[currentLang].tooltipDelete}">🗑️</button>
                            </div>
                        `;
                    } else {
                        card.innerHTML = `
                            <div class="flex items-center gap-4 flex-1">
                                <div onclick="toggleEditMatch(${m.id})" class="${dateBoxStyle} cursor-pointer px-3 py-2 rounded-lg border text-center shrink-0 min-w-[85px] transition group" title="Kliknutím upravit">
                                    <p class="text-[10px] uppercase font-bold opacity-80">${translations[currentLang].termLabel}</p>
                                    <p class="text-sm font-black">${formattedDate || translations[currentLang].noTermLabel}</p>
                                    <p class="text-xs font-semibold">${m.time || '--:--'}</p>
                                </div>
                                <div class="truncate flex-1">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="text-lg font-bold ${nameColorClass}">${m.opponent}</span>
                                        <span class="text-xs font-medium text-gray-400 bg-gray-800 px-2 py-0.5 rounded border border-gray-700">${m.format}</span>
                                        ${m.mustPlay ? `<span class="text-xs font-bold text-red-400 bg-red-950/60 px-2 py-0.5 rounded border border-red-800 flex items-center gap-1">${translations[currentLang].mustPlayLabel}</span>` : ''}
                                        ${!m.date && m.week && isWeekInPastOrCurrent(m.week) ? `<span class="text-xs font-bold text-yellow-500 bg-yellow-950/40 px-2 py-0.5 rounded border border-yellow-800 flex items-center gap-1">⚠️</span>` : ''}
                                        ${m.week ? `<span class="text-xs text-blue-400 bg-blue-950/40 px-2 py-0.5 rounded border border-blue-900/30 font-semibold">${m.week}</span>` : ''}
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1 truncate">🖥️ ${m.server} • 🏆 ${m.comp}</p>
                                    ${m.notes ? `<p class="text-xs text-gray-400 mt-1 italic">📝 ${m.notes}</p>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto justify-end pt-2 sm:pt-0 border-t sm:border-none border-gray-800">
                                <button type="button" onclick="toggleMustPlay(${m.id})" class="p-2 rounded-lg text-xs font-semibold transition ${m.mustPlay ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-400 hover:text-red-400'}" title="Nachholspiel">🔥</button>
                                ${m.date ? `<button type="button" onclick="openGoogleCalendar(${m.id})" class="bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 p-2 rounded-lg text-xs font-semibold transition flex items-center gap-1" title="${translations[currentLang].tooltipGCal}">📅</button>` : ''}
                                ${m.date ? `<button type="button" onclick="toggleConfirmed(${m.id})" class="p-2 rounded-lg text-xs font-semibold transition border ${m.confirmed ? 'bg-emerald-600/20 text-emerald-400 border-emerald-500/40' : 'bg-gray-900 text-gray-500 border-gray-800 hover:text-gray-300'}" title="${translations[currentLang].lblConfirmedCheck}">👍</button>` : ''}
                                <button type="button" onclick="quickDeleteMatch(${m.id})" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 p-2 rounded-lg text-xs font-semibold transition" title="Rychle uzavřít / smazat">✅</button>
                                <button type="button" onclick="toggleEditMatch(${m.id})" class="bg-orange-600/10 hover:bg-orange-600/20 text-orange-400 border border-orange-500/30 p-2 rounded-lg text-xs font-semibold transition" title="${translations[currentLang].tooltipEdit}">✏️</button>
                            </div>
                        `;
                    }
                    container.appendChild(card);
                    if (isEditing) {
                        const editDateEl = document.getElementById(`edit-date-${m.id}`);
                        if (editDateEl) { setupDateInput(editDateEl); editDateEl.addEventListener('input', () => handleDatePlaceholder(editDateEl)); }
                    }
                });
            } else {
                Object.keys(grouped).forEach(serverName => {
                    const sEl = document.createElement("div"); sEl.id = serverName.replace(/\s+/g, '-'); sEl.className = "bg-gray-900 rounded-xl border border-gray-800 p-4 space-y-4 shadow-lg";
                    sEl.innerHTML = `<h2 class="text-xl font-bold text-orange-500 flex justify-between items-center"><span>🖥️ ${serverName}</span><div class="flex gap-2"><button type="button" onclick="editServerName('${serverName}')" class="text-xs text-gray-400 hover:text-orange-400">✏️</button><button type="button" onclick="openLeagueDeleteModal('${serverName}')" class="text-xs text-red-400">🗑️</button></div></h2>`;

                    Object.keys(grouped[serverName]).forEach(compName => {
                        const compMatches = grouped[serverName][compName];
                        const collapseKey = `${serverName}__${compName}`;
                        const isClosed = closedStates[collapseKey] || false;

                        const lEl = document.createElement("div"); lEl.id = `${sEl.id}-${compName.replace(/\s+/g, '-')}`; lEl.className = "bg-gray-850 p-3 rounded-lg border border-gray-800 space-y-2";
                        lEl.innerHTML = `
                            <div class="flex justify-between items-center cursor-pointer select-none" onclick="toggleCollapse('${collapseKey}')">
                                <h3 class="font-semibold text-gray-200 flex items-center gap-2">
                                    <span class="text-xs text-orange-400">${isClosed ? '▶' : '▼'}</span>
                                    🏆 ${compName} <span class="text-xs bg-gray-900 px-2 py-0.5 rounded text-gray-400">${compMatches.length}</span>
                                </h3>
                                <div class="flex gap-2" onclick="event.stopPropagation()">
                                    <button type="button" onclick="editCompName('${serverName}', '${compName}')" class="text-xs text-gray-400 hover:text-orange-400">✏️</button>
                                    <button type="button" onclick="toggleForm('${serverName}', '${compName}')" class="text-xs bg-orange-600/20 hover:bg-orange-600/30 text-orange-400 px-2.5 py-1 rounded border border-orange-500/30">${translations[currentLang].btnAddMatchToLeague}</button>
                                </div>
                            </div>
                        `;

                        let dotsHtml = `<div class="flex flex-wrap gap-1 px-1 py-1">`;
                        compMatches.forEach(m => {
                            let dotColor = "bg-red-500";
                            if (m.date) {
                                if (isCurrentCalendarWeek(m.date)) dotColor = "bg-yellow-500";
                                else if (m.confirmed) dotColor = "bg-emerald-500";
                                else dotColor = "bg-yellow-500";
                            }
                            dotsHtml += `<span class="inline-block w-2 h-2 rounded-full ${dotColor}" title="${m.opponent} (${m.date || 'bez termínu'})"></span>`;
                        });
                        dotsHtml += `</div>`; lEl.innerHTML += dotsHtml;

                        if (!isClosed) {
                            const matchesContainer = document.createElement("div"); matchesContainer.className = "space-y-2 mt-2";
                            compMatches.forEach(m => {
                                const mDiv = document.createElement("div");
                                mDiv.className = "bg-gray-900 p-3 rounded border border-gray-800 flex justify-between items-center";
                                let formattedMatchDate = m.date ? `${parseInt(m.date.split('-')[2])}.${parseInt(m.date.split('-')[1])}.` : translations[currentLang].noTermLabel;

                                let statusIconHTML = "";
                                if (m.mustPlay) statusIconHTML = `<span class="text-xs text-red-400 font-bold mr-2" title="Dohrávka">🔥</span>`;
                                else if (!m.date && m.week && isWeekInPastOrCurrent(m.week)) statusIconHTML = `<span class="text-xs text-yellow-500 font-bold mr-2" title="Nutno naplánovat">⚠️</span>`;

                                let matchNameColor = m.date ? (isCurrentCalendarWeek(m.date) ? "text-yellow-400" : (m.confirmed ? "text-emerald-400" : "text-red-400")) : "text-white";

                                mDiv.innerHTML = `
                                    <div class="flex items-center">
                                        ${statusIconHTML}
                                        <span class="font-bold ${matchNameColor}">${m.opponent}</span>
                                        <span class="text-xs text-gray-400 ml-2 bg-gray-800 px-2 py-0.5 rounded">${m.format}</span>
                                        ${m.week ? `<span class="text-xs text-blue-400 bg-blue-950/40 px-2 py-0.5 rounded border border-blue-900/30 font-semibold ml-2">${m.week}</span>` : ''}
                                    </div>
                                    <div class="flex gap-3 items-center">
                                        <span class="text-xs font-semibold ${m.date ? 'text-white' : 'text-gray-500'}">${formattedMatchDate} ${m.time || ''}</span>
                                        <button type="button" onclick="editMatchFromHome(${m.id})" class="text-xs bg-orange-600/10 hover:bg-orange-600/20 text-orange-400 px-2 py-1 rounded border border-orange-500/30" title="Upravit zápas">✏️</button>
                                    </div>
                                `;
                                matchesContainer.appendChild(mDiv);
                            });
                            lEl.appendChild(matchesContainer);
                        }
                        sEl.appendChild(lEl);
                    });
                    container.appendChild(sEl);
                });
            }
        }

        function saveFromForm() {
            let server = document.getElementById("formServer").value;
            if (server === "__NEW__") {
                server = document.getElementById("formNewServerInput").value.trim();
                if (!server) return alert("Zadej název serveru");
            }
            const comp = document.getElementById("formComp").value.trim();
            if (!comp) return alert("Zadej název ligy");

            const fmtType = document.getElementById("formFormatType").value;
            const fmtNum = document.getElementById("formFormatNum").value.trim();
            const gameVariant = document.getElementById("formGameVariant").value.trim();
            const outVariant = document.getElementById("formOutVariant").value;
            const format = `${fmtType} ${fmtNum} ${gameVariant} ${outVariant}`;
            const duration = parseInt(document.getElementById("formDuration").value) || calculateDurationMinutes(format);
            const maxWeekly = document.getElementById("formMaxWeekly").value.trim();
            const finalDeadline = document.getElementById("formFinalDeadline").value;
            const discordUrl = document.getElementById("formDiscordUrl").value.trim();
            const webUrl = document.getElementById("formWebUrl").value.trim();

            pushToHistory();

            if (formMode === "single") {
                const opponent = document.getElementById("formOpponent").value.trim();
                const week = document.getElementById("formWeek").value.trim();
                const mType = document.getElementById("formMatchType").value;
                const incRematch = document.getElementById("formSingleRematch").checked;
                if (!opponent) return alert("Zadej soupeře");

                matches.push({ id: Date.now(), server, comp, opponent, format, duration, type: mType, week, date: "", time: "", confirmed: false, mustPlay: false, status: "unscheduled", notes: "", maxWeekly, finalDeadline, discordUrl, webUrl });
                
                if (incRematch) {
                    matches.push({ id: Date.now() + 1, server, comp, opponent, format, duration, type: mType, week: week ? `${week} (Odveta)` : "Odveta", date: "", time: "", confirmed: false, mustPlay: false, status: "unscheduled", notes: "Odveta", maxWeekly, finalDeadline, discordUrl, webUrl });
                }
            } else {
                const listEl = document.getElementById("formOpponentsList");
                if(!listEl) return;
                const names = listEl.value.split("\n").map(n => n.trim()).filter(n => n);
                if (names.length === 0) return alert("Zadej aspoň jednoho soupeře");
                const rematchesEl = document.getElementById("formRematches");
                const bulkDateEl = document.getElementById("formBulkStartDate");
                const bulkWeek = document.getElementById("formBulkWeek").value.trim();
                const bulkMatchType = document.getElementById("formBulkMatchType").value;
                const incRematches = rematchesEl ? rematchesEl.checked : false;
                const bDate = (bulkDateEl && bulkDateEl.value) ? new Date(bulkDateEl.value) : null;
                
                names.forEach((name, idx) => {
                    let w = bulkWeek ? `${bulkWeek} ${idx + 1}` : (bDate ? `(${new Date(bDate.getTime() + idx*7*86400000).getDate()}.${new Date(bDate.getTime() + idx*7*86400000).getMonth()+1}.)` : "");
                    matches.push({ id: Date.now() + idx, server, comp, opponent: name, format, duration, type: bulkMatchType, week: w, date: "", time: "", confirmed: false, mustPlay: false, status: "unscheduled", notes: "", maxWeekly, finalDeadline, discordUrl, webUrl });
                });
                if (incRematches) {
                    names.forEach((name, idx) => {
                        let w = bulkWeek ? `Odveta ${idx + 1}` : (bDate ? `(${new Date(bDate.getTime() + (names.length+idx)*7*86400000).getDate()}.${new Date(bDate.getTime() + (names.length+idx)*7*86400000).getMonth()+1}.)` : "Odveta");
                        matches.push({ id: Date.now() + names.length + idx, server, comp, opponent: name, format, duration, type: bulkMatchType, week: w, date: "", time: "", confirmed: false, mustPlay: false, status: "unscheduled", notes: "Odveta", maxWeekly, finalDeadline, discordUrl, webUrl });
                    });
                }
            }
            updateServerSelect(); save(); toggleForm();
        }

        document.addEventListener("DOMContentLoaded", () => {
            setLanguage(currentLang);
            updateUndoButton();
            render();
            updateDefaultDuration();
        });
    </script>
</body>
</html>
