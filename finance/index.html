<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domácí Finance - Plánovač</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121214; }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 2px; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="text-gray-100 min-h-screen overflow-hidden">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col shrink-0 text-gray-300">
            <div class="p-4 border-b border-gray-800 flex items-center justify-between gap-2">
                <button onclick="goHome()" class="flex-1 bg-gray-900 rounded-lg py-2.5 flex items-center justify-center">🏠</button>
                <button onclick="setView('muster')" class="flex-1 bg-gray-900 rounded-lg py-2.5 flex items-center justify-center">📋</button>
                <button onclick="toggleForm()" class="flex-1 bg-gray-900 rounded-lg py-2.5 flex items-center justify-center">➕</button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4 sidebar-scroll">
                <div id="sidebarMonths" class="space-y-1"></div>
                <button onclick="generateNextMonth()" class="w-full bg-orange-600/10 text-orange-400 py-2 text-xs rounded-lg">➕ Přidat měsíc</button>
            </div>
            <div class="p-4 border-t border-gray-800 flex gap-2">
                <button onclick="exportData()" class="flex-1 bg-gray-900 p-2 rounded">📤</button>
                <label class="flex-1 bg-gray-900 p-2 rounded text-center cursor-pointer">
                    📥
                    <input type="file" id="importFile" onchange="importData(event)" class="hidden">
                </label>
                <button onclick="resetToDefault()" class="flex-1 bg-gray-900 p-2 rounded">🔥</button>
            </div>
        </aside>

        <!-- Main -->
        <main class="flex-1 h-screen overflow-y-auto bg-[#121214] p-8">
            <div id="itemForm" class="hidden bg-gray-900 p-6 rounded-xl border border-gray-800 mb-6">
                <h2 class="text-xl font-bold text-orange-400 mb-4">Přidat položku</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="formName" placeholder="Název" class="bg-gray-950 border border-gray-800 p-2 rounded text-sm">
                    <input type="number" id="formAmount" placeholder="Částka" class="bg-gray-950 border border-gray-800 p-2 rounded text-sm">
                    <button onclick="saveItem()" class="bg-orange-600 text-white p-2 rounded">Uložit</button>
                    <button onclick="toggleForm()" class="bg-gray-800 p-2 rounded">Zrušit</button>
                </div>
            </div>
            <div id="mainContent"></div>
        </main>
    </div>

    <script>
        let muster = JSON.parse(localStorage.getItem("finMusterV16")) || [];
        let accountBalances = JSON.parse(localStorage.getItem("finBalancesV16")) || { "DE": 0, "Revolut": 0, "SK": 0, "CC": 0 };
        let modifiedData = JSON.parse(localStorage.getItem("finModifiedV16")) || { deleted: {}, added: {}, amounts: {}, names: {} };
        let generatedMonths = JSON.parse(localStorage.getItem("finMonthsV16")) || ["2026-07"];
        let activeMonth = localStorage.getItem("finActiveMonthV16") || "2026-07";
        let currentView = localStorage.getItem("finCurrentViewV16") || "home";

        function save() {
            localStorage.setItem("finMusterV16", JSON.stringify(muster));
            localStorage.setItem("finBalancesV16", JSON.stringify(accountBalances));
            localStorage.setItem("finModifiedV16", JSON.stringify(modifiedData));
            localStorage.setItem("finMonthsV16", JSON.stringify(generatedMonths));
            localStorage.setItem("finActiveMonthV16", activeMonth);
            localStorage.setItem("finCurrentViewV16", currentView);
            render();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    muster = imported.muster || [];
                    accountBalances = imported.accountBalances || {};
                    modifiedData = imported.modifiedData || { deleted: {}, added: {}, amounts: {}, names: {} };
                    generatedMonths = imported.generatedMonths || ["2026-07"];
                    save();
                    alert("Importováno!");
                } catch (err) {
                    alert("Chyba importu JSON.");
                }
            };
            reader.readAsText(file);
        }

        function exportData() {
            const dataStr = JSON.stringify({ muster, accountBalances, modifiedData, generatedMonths });
            const dataUri = 'data:application/json,' + encodeURIComponent(dataStr);
            const a = document.createElement('a');
            a.href = dataUri;
            a.download = 'zaloha.json';
            a.click();
        }

        function toggleForm() { document.getElementById("itemForm").classList.toggle("hidden"); }
        function goHome() { currentView = "home"; render(); }
        function setView(v) { currentView = v; render(); }
        function generateNextMonth() { 
            let [y, m] = generatedMonths[generatedMonths.length-1].split("-").map(Number);
            if(++m > 12) { m = 1; y++; }
            generatedMonths.push(`${y}-${String(m).padStart(2, '0')}`);
            save();
        }
        function resetToDefault() { if(confirm("Reset?")) { localStorage.clear(); location.reload(); } }
        
        function render() {
            renderSidebar();
            document.getElementById("mainContent").innerHTML = `Přehled pro ${activeMonth}`;
        }

        function renderSidebar() {
            const cont = document.getElementById("sidebarMonths");
            cont.innerHTML = generatedMonths.map(m => `<button onclick="activeMonth='${m}'; render()" class="w-full text-left text-xs p-2 rounded bg-gray-900">${m}</button>`).join("");
        }

        render();
    </script>
</body>
</html>
